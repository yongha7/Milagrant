<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mila Video</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;width:100%;height:100%;background:#090b10;color:#f5f6fa;font-family:Arial,sans-serif;overflow:hidden}
button,input,textarea{font:inherit}
button{border:1px solid #353b4a;background:#1b202b;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;min-height:38px}
button:disabled{opacity:.35;cursor:default}
button.active{background:#6455e8;border-color:#8175ff}
input,textarea{background:#141923;border:1px solid #353b4a;color:#fff;border-radius:8px;padding:10px;width:100%}
#gate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#090b10;padding:20px}
.gatebox{width:min(360px,100%);background:#141923;padding:24px;border-radius:16px;border:1px solid #303748}
#app{display:none;height:100%;height:100dvh;flex-direction:column}
header{flex:none;padding:7px 10px;display:flex;align-items:center;gap:8px;background:#11151e;border-bottom:1px solid #292f3d;min-height:46px}
.brand{font-weight:800;white-space:nowrap;font-size:13px}
#headerTitle{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:#b8c0d2;font-size:13px}
#videoScreen{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:#000}
#videoStage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;touch-action:pan-y}
#videoFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#cropBox{position:absolute;z-index:6;border:2px solid #8b7cff;display:none;pointer-events:none;box-shadow:0 0 0 9999px #0009}
#cropHint{position:absolute;z-index:7;top:8px;left:8px;right:8px;text-align:center;padding:8px;background:#161a26ef;border:1px solid #5b52a7;border-radius:8px;display:none;font-size:12px}
#bottomBar{display:flex;gap:6px;flex-wrap:wrap;padding:7px;background:#11151e;border-top:1px solid #292f3d;justify-content:center}
#bottomBar button{font-size:12px;padding:7px 9px}
#description{padding:6px 12px;background:#11151e;color:#adb5c8;font-size:12px;max-height:42px;overflow:auto;white-space:pre-wrap}
.panel{position:fixed;inset:0;z-index:50;background:#000b;display:none;align-items:center;justify-content:center;padding:14px}
.panel.show{display:flex}
.dialog{width:min(520px,100%);max-height:90%;overflow:auto;background:#151a25;border:1px solid #353c50;border-radius:15px;padding:16px}
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:#bbc3d4;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row>*{flex:1}
.small{font-size:12px;color:#aab3c6;line-height:1.5}
#storyboardScreen{position:fixed;inset:0;z-index:30;background:#0a0d13;display:none;flex-direction:column}
#storyboardScreen.show{display:flex}
.storyhead{display:flex;align-items:center;gap:6px;padding:8px;background:#141923;flex-wrap:wrap}
.storyhead strong{flex:1;min-width:100px}
#storyCounter{font-size:12px;color:#bdc5d7;white-space:nowrap}
#storyTabs{display:flex;gap:6px;padding:7px;background:#10141d}
#storyTabs button{flex:1}
#storyGrid{flex:1;min-height:0;overflow:auto;padding:8px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-content:start}
.storyCell{position:relative;aspect-ratio:1;padding:0;min-width:0;overflow:hidden;background:#171d28;border:1px solid #353b49;border-radius:6px}
.storyCell canvas,.storyCell img{display:block;width:100%;height:100%;object-fit:cover}
.storyCell span{position:absolute;bottom:0;left:0;right:0;background:#000b;font-size:10px;padding:3px}
.storyCell.selected{border:2px solid #9b8cff}
#detailScreen{position:fixed;inset:0;z-index:40;background:#050608;display:none;flex-direction:column}
#detailScreen.show{display:flex}
.detailhead{display:flex;align-items:center;gap:6px;padding:8px;background:#11151e;flex-wrap:wrap}
#detailTitle{flex:1;min-width:65px;font-size:13px}
#detailCounter{font-size:12px;color:#bdc5d7;white-space:nowrap}
#detailViewport{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;position:relative;background:#050608}
#detailCanvas{display:block;max-width:none;max-height:none;transform-origin:center center;touch-action:none}
#detailImage{display:none;max-width:none;max-height:none;user-select:none;-webkit-user-drag:none;transform-origin:center center;touch-action:none}
.detailnav{display:flex;gap:8px;justify-content:center;padding:8px;background:#11151e}
.detailnav button{flex:1;max-width:200px}
@media(min-width:650px){#storyGrid{grid-template-columns:repeat(10,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="gate">
 <div class="gatebox">
  <h2>Mila Video</h2>
  <p class="small">접속 비밀번호를 입력하세요.</p>
  <input id="passwordInput" type="password" placeholder="비밀번호" autocomplete="off">
  <div class="row"><button id="unlockBtn" class="active">입장</button></div>
  <p id="gateError" class="small"></p>
 </div>
</div>

<div id="app">
 <header>
  <div class="brand">MILA VIDEO</div>
  <div id="headerTitle">mila grant prison intake</div>
  <button id="menuBtn">설정</button>
 </header>
 <main id="videoScreen">
  <div id="videoStage">
   <iframe id="videoFrame" src="https://u.pcloud.link/publink/show?code=XZlxhzJZrigVSStpBFR7SU4aCsHBo01eFvFV" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
   <div id="cropBox"></div><div id="cropHint">크롭할 영역을 드래그하세요.</div>
  </div>
  <div id="description"></div>
  <div id="bottomBar">
   <button id="clickMode" class="active">클릭</button>
   <button id="zoomMode">확대</button>
   <button id="viewMode">보기</button>
   <button id="cropBtn">크롭 설정</button>
   <button id="storyBtn">스토리보드</button>
  </div>
 </main>
</div>

<div class="panel" id="settingsPanel">
 <div class="dialog">
  <h3>설정</h3>
  <div class="field"><label>제목</label><input id="titleInput" value="mila grant prison intake"></div>
  <div class="field"><label>설명</label><textarea id="descInput" rows="3" placeholder="영상 설명"></textarea></div>
  <div class="row"><button id="saveTextBtn" class="active">제목·설명 저장</button><button id="closeSettingsBtn">닫기</button></div>
  <hr style="border-color:#303747;margin:18px 0">
  <h3>크롭</h3>
  <p class="small">영역 지정을 누른 뒤 영상에서 드래그하여 사각형을 지정하세요.</p>
  <div class="row"><button id="startCropBtn" class="active">영역 지정</button><button id="applyCropBtn">적용</button></div>
  <div class="row"><button id="resetCropBtn">크롭 초기화</button><button id="closeSettingsBtn2">닫기</button></div>
  <p id="cropStatus" class="small"></p>
 </div>
</div>

<div id="storyboardScreen">
 <div class="storyhead">
  <strong id="storyHeaderTitle">메인 스토리보드</strong>
  <span id="storyCounter">1 / 100</span>
  <button id="storyPrev">◀ 이전</button>
  <button id="storyNext" class="active">다음 ▶</button>
  <button id="closeStoryBtn">닫기</button>
 </div>
 <div id="storyTabs">
  <button id="mainTab" class="active">메인 10×10</button>
  <button id="detailTab">세부 이미지 20장</button>
 </div>
 <div id="storyGrid"></div>
 <div class="small" style="padding:6px 10px">메인: storyboard.png · 세부: storyboard_0001.jpg ~ storyboard_0020.jpg</div>
</div>

<div id="detailScreen">
 <div class="detailhead">
  <button id="detailBack">목록</button>
  <strong id="detailTitle">이미지</strong>
  <span id="detailCounter">1 / 100</span>
  <button id="detailReset">초기화</button>
  <button id="detailClose">닫기</button>
 </div>
 <div id="detailViewport">
  <canvas id="detailCanvas"></canvas>
  <img id="detailImage" alt="세부 스토리보드">
 </div>
 <div class="detailnav">
  <button id="detailPrev">◀ 이전</button>
  <button id="detailNext" class="active">다음 ▶</button>
 </div>
</div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const KEY="mila_video_app_v4";
let saved={};
try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){}
const data={
 title:saved.title||"mila grant prison intake",
 description:saved.description||"",
 crop:saved.crop||null,
 mode:saved.mode||"click"
};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}

$("unlockBtn").addEventListener("click",unlock);
$("passwordInput").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
function unlock(){
 if($("passwordInput").value!=="mila130102!"){
  $("gateError").textContent="비밀번호가 올바르지 않습니다.";return;
 }
 $("gate").style.display="none";
 $("app").style.display="flex";
 $("titleInput").value=data.title;
 $("descInput").value=data.description;
 $("headerTitle").textContent=data.title;
 $("description").textContent=data.description;
 setMode(data.mode);
 applyCrop();
}
$("menuBtn").addEventListener("click",()=>{
 $("settingsPanel").classList.add("show");updateCropStatus();
});
function closeSettings(){$("settingsPanel").classList.remove("show");}
$("closeSettingsBtn").addEventListener("click",closeSettings);
$("closeSettingsBtn2").addEventListener("click",closeSettings);
$("saveTextBtn").addEventListener("click",()=>{
 data.title=$("titleInput").value.trim()||"Mila Video";
 data.description=$("descInput").value;
 $("headerTitle").textContent=data.title;
 $("description").textContent=data.description;
 persist();
});
function setMode(m){
 data.mode=m;
 ["click","zoom","view"].forEach(n=>$((n==="click"?"clickMode":n==="zoom"?"zoomMode":"viewMode")).classList.toggle("active",m===n));
 $("videoFrame").style.pointerEvents=m==="click"?"auto":"none";
 $("videoStage").style.touchAction=m==="zoom"?"none":"auto";
 persist();
}
$("clickMode").addEventListener("click",()=>setMode("click"));
$("zoomMode").addEventListener("click",()=>setMode("zoom"));
$("viewMode").addEventListener("click",()=>setMode("view"));

/* 크롭 영역 저장 및 적용 */
let cropOn=false,cropStart=null,cropTemp=null;
function stagePoint(e){
 const r=$("videoStage").getBoundingClientRect();
 return {x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))};
}
function beginCrop(){
 closeSettings();cropOn=true;cropStart=null;cropTemp=null;
 $("cropHint").style.display="block";$("cropBox").style.display="none";
 $("videoStage").style.cursor="crosshair";$("videoStage").style.touchAction="none";
}
$("cropBtn").addEventListener("click",beginCrop);
$("startCropBtn").addEventListener("click",beginCrop);
$("videoStage").addEventListener("pointerdown",e=>{
 if(!cropOn)return;e.preventDefault();cropStart=stagePoint(e);
 cropTemp={x:cropStart.x,y:cropStart.y,w:0,h:0};
 try{$("videoStage").setPointerCapture(e.pointerId);}catch(_){}
 drawCrop();
});
$("videoStage").addEventListener("pointermove",e=>{
 if(!cropOn||!cropStart)return;e.preventDefault();const p=stagePoint(e);
 cropTemp={x:Math.min(cropStart.x,p.x),y:Math.min(cropStart.y,p.y),w:Math.abs(p.x-cropStart.x),h:Math.abs(p.y-cropStart.y)};
 drawCrop();
});
function drawCrop(){
 if(!cropTemp)return;const r=$("videoStage").getBoundingClientRect(),b=$("cropBox"),c=cropTemp;
 b.style.display="block";b.style.left=c.x*r.width+"px";b.style.top=c.y*r.height+"px";b.style.width=c.w*r.width+"px";b.style.height=c.h*r.height+"px";
}
function finishCrop(){
 if(!cropOn||!cropTemp)return;
 if(cropTemp.w>.02&&cropTemp.h>.02)data.crop={...cropTemp};
 cropOn=false;cropStart=null;cropTemp=null;
 $("cropHint").style.display="none";$("cropBox").style.display="none";$("videoStage").style.cursor="";
 $("videoStage").style.touchAction=data.mode==="zoom"?"none":"auto";
 persist();applyCrop();updateCropStatus();
}
$("videoStage").addEventListener("pointerup",finishCrop);
$("videoStage").addEventListener("pointercancel",finishCrop);
function applyCrop(){
 const f=$("videoFrame"),c=data.crop;
 if(!c){f.style.clipPath="none";f.style.webkitClipPath="none";return;}
 const x=Math.max(0,Math.min(1,c.x)),y=Math.max(0,Math.min(1,c.y));
 const w=Math.max(0,Math.min(1-x,c.w)),h=Math.max(0,Math.min(1-y,c.h));
 f.style.clipPath=`inset(${y*100}% ${(1-x-w)*100}% ${(1-y-h)*100}% ${x*100}%)`;
 f.style.webkitClipPath=f.style.clipPath;
}
$("applyCropBtn").addEventListener("click",()=>{
 if(cropTemp&&cropTemp.w>.02&&cropTemp.h>.02)data.crop={...cropTemp};
 if(!data.crop){$("cropStatus").textContent="먼저 영역을 지정하세요.";return;}
 cropOn=false;cropStart=null;cropTemp=null;$("cropHint").style.display="none";$("cropBox").style.display="none";
 applyCrop();persist();updateCropStatus();closeSettings();
});
$("resetCropBtn").addEventListener("click",()=>{
 data.crop=null;cropOn=false;cropStart=null;cropTemp=null;
 $("cropHint").style.display="none";$("cropBox").style.display="none";
 applyCrop();persist();updateCropStatus();
});
function updateCropStatus(){
 $("cropStatus").textContent=data.crop?"크롭 영역 저장됨":"크롭 미적용";
}

/* 스토리보드 */
const mainImage=new Image();
let mainLoaded=false,mainError=false;
mainImage.onload=()=>{mainLoaded=true;mainError=false;renderStory();};
mainImage.onerror=()=>{mainError=true;mainLoaded=false;renderStory();};
mainImage.src="storyboard.png";

let storyMode="main",mainIndex=0,detailIndex=1;
let selectedKind="main",selectedIndex=0;
let detailImageSrc="";
$("storyBtn").addEventListener("click",()=>{
 $("storyboardScreen").classList.add("show");
 storyMode="main";renderStory();
});
$("closeStoryBtn").addEventListener("click",()=>$("storyboardScreen").classList.remove("show"));
$("mainTab").addEventListener("click",()=>{storyMode="main";renderStory();});
$("detailTab").addEventListener("click",()=>{storyMode="detail";renderStory();});

function renderStory(){
 const grid=$("storyGrid");
 $("mainTab").classList.toggle("active",storyMode==="main");
 $("detailTab").classList.toggle("active",storyMode==="detail");
 $("storyHeaderTitle").textContent=storyMode==="main"?"메인 스토리보드":"세부 스토리보드";
 $("storyCounter").textContent=storyMode==="main"?(mainIndex+1)+" / 100":detailIndex+" / 20";
 $("storyPrev").disabled=false;$("storyNext").disabled=false;
 if(storyMode==="main"){
  grid.style.gridTemplateColumns=window.innerWidth>=650?"repeat(10,minmax(0,1fr))":"repeat(5,minmax(0,1fr))";
  buildMainCells(grid);
 }else{
  grid.style.gridTemplateColumns=window.innerWidth>=650?"repeat(5,minmax(0,1fr))":"repeat(3,minmax(0,1fr))";
  buildDetailCells(grid);
 }
}
function buildMainCells(grid){
 grid.innerHTML="";
 for(let i=0;i<100;i++){
  const b=document.createElement("button");b.className="storyCell"+(i===mainIndex?" selected":"");
  const c=document.createElement("canvas");c.width=100;c.height=100;
  const ctx=c.getContext("2d");
  if(mainLoaded){
   const sw=mainImage.naturalWidth/10,sh=mainImage.naturalHeight/10;
   const sx=(i%10)*sw,sy=Math.floor(i/10)*sh;
   ctx.drawImage(mainImage,sx,sy,sw,sh,0,0,100,100);
  }else{
   ctx.fillStyle="#202635";ctx.fillRect(0,0,100,100);
   ctx.fillStyle="#fff";ctx.font="22px Arial";ctx.textAlign="center";ctx.fillText(String(i+1),50,55);
   if(mainError){ctx.font="11px Arial";ctx.fillText("이미지 없음",50,75);}
  }
  b.appendChild(c);
  const label=document.createElement("span");label.textContent=String(i+1).padStart(2,"0");b.appendChild(label);
  b.addEventListener("click",()=>openMainDetail(i));
  grid.appendChild(b);
 }
}
function buildDetailCells(grid){
 grid.innerHTML="";
 for(let i=1;i<=20;i++){
  const b=document.createElement("button");b.className="storyCell"+(i===detailIndex?" selected":"");
  const img=document.createElement("img");img.src=detailPath(i);img.alt="세부 스토리보드 "+i;img.loading="lazy";
  img.onerror=()=>{img.style.display="none";b.style.background="#202635";};
  b.appendChild(img);
  const label=document.createElement("span");label.textContent="세부 "+String(i).padStart(2,"0");b.appendChild(label);
  b.addEventListener("click",()=>openDetailStory(i));
  grid.appendChild(b);
 }
}
function detailPath(i){return "storyboard_"+String(i).padStart(4,"0")+".jpg";}
$("storyPrev").addEventListener("click",()=>stepStory(-1));
$("storyNext").addEventListener("click",()=>stepStory(1));
function stepStory(d){
 if(storyMode==="main")mainIndex=(mainIndex+d+100)%100;
 else detailIndex=((detailIndex-1+d+20)%20)+1;
 renderStory();
}

/* 이미지 상세 보기: 메인 PNG에서 선택 칸만 잘라 표시 */
function openMainDetail(i){
 selectedKind="main";selectedIndex=i;mainIndex=i;
 $("detailImage").style.display="none";
 $("detailCanvas").style.display="block";
 $("detailScreen").classList.add("show");
 renderDetailView();resetDetailZoom();updateDetailHeader();
}
function openDetailStory(i){
 selectedKind="detail";selectedIndex=i;detailIndex=i;
 $("detailImage").src=detailPath(i);
 $("detailCanvas").style.display="none";
 $("detailImage").style.display="block";
 $("detailScreen").classList.add("show");
 resetDetailZoom();updateDetailHeader();
}
function renderDetailView(){
 const c=$("detailCanvas"),ctx=c.getContext("2d");
 if(!mainLoaded){
  c.width=600;c.height=600;ctx.fillStyle="#161b25";ctx.fillRect(0,0,600,600);
  ctx.fillStyle="#fff";ctx.font="20px Arial";ctx.fillText(mainError?"storyboard.png를 찾을 수 없습니다.":"이미지 불러오는 중...",25,50);
  return;
 }
 const sw=mainImage.naturalWidth/10,sh=mainImage.naturalHeight/10;
 const i=selectedIndex;
 c.width=Math.max(1,Math.round(sw));c.height=Math.max(1,Math.round(sh));
 ctx.drawImage(mainImage,(i%10)*sw,Math.floor(i/10)*sh,sw,sh,0,0,c.width,c.height);
}
let z=1,tx=0,ty=0,pointers=new Map(),pinch=null,lastTap=null;
function activeDetailElement(){return selectedKind==="main"?$("detailCanvas"):$("detailImage");}
function resetDetailZoom(){z=1;tx=0;ty=0;renderZoom();}
function renderZoom(){
 const el=activeDetailElement();
 el.style.transform=`translate(${tx}px,${ty}px) scale(${z})`;
 const v=$("detailViewport");
 const w=el.naturalWidth||el.width||v.clientWidth;
 const h=el.naturalHeight||el.height||v.clientHeight;
 const base=Math.min(v.clientWidth/Math.max(1,w),v.clientHeight/Math.max(1,h),1);
 el.style.width=(w*base)+"px";el.style.height=(h*base)+"px";
}
function updateDetailHeader(){
 $("detailTitle").textContent=selectedKind==="main"?"메인 이미지 "+(selectedIndex+1):"세부 이미지 "+selectedIndex;
 $("detailCounter").textContent=selectedKind==="main"?(selectedIndex+1)+" / 100":selectedIndex+" / 20";
 $("detailPrev").textContent=selectedKind==="main"?"◀ 이전 이미지":"◀ 이전 스토리보드";
 $("detailNext").textContent=selectedKind==="main"?"다음 이미지 ▶":"다음 스토리보드 ▶";
}
$("detailBack").addEventListener("click",()=>$("detailScreen").classList.remove("show"));
$("detailClose").addEventListener("click",()=>$("detailScreen").classList.remove("show"));
$("detailReset").addEventListener("click",resetDetailZoom);
function moveDetail(d){
 if(selectedKind==="main"){
  selectedIndex=(selectedIndex+d+100)%100;mainIndex=selectedIndex;renderDetailView();
 }else{
  selectedIndex=((selectedIndex-1+d+20)%20)+1;detailIndex=selectedIndex;
  $("detailImage").src=detailPath(selectedIndex);
 }
 resetDetailZoom();updateDetailHeader();renderStory();
}
$("detailPrev").addEventListener("click",()=>moveDetail(-1));
$("detailNext").addEventListener("click",()=>moveDetail(1));

const viewport=$("detailViewport");
viewport.addEventListener("pointerdown",e=>{
 if(selectedKind!=="main"&&$("detailImage").complete===false)return;
 try{viewport.setPointerCapture(e.pointerId);}catch(_){}
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){
  const p=[...pointers.values()];
  pinch={distance:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),scale:z};
 }
});
viewport.addEventListener("pointermove",e=>{
 if(!pointers.has(e.pointerId))return;
 const old=pointers.get(e.pointerId);
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size>=2&&pinch){
  const p=[...pointers.values()];
  const dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
  z=Math.max(.5,Math.min(10,pinch.scale*dist/Math.max(1,pinch.distance)));
 }else{
  tx+=e.clientX-old.x;ty+=e.clientY-old.y;
 }
 renderZoom();
});
function pointerEnd(e){
 pointers.delete(e.pointerId);
 if(pointers.size<2)pinch=null;
}
viewport.addEventListener("pointerup",pointerEnd);
viewport.addEventListener("pointercancel",pointerEnd);
viewport.addEventListener("wheel",e=>{
 if(!$("detailScreen").classList.contains("show"))return;
 e.preventDefault();
 z=Math.max(.5,Math.min(10,z*(e.deltaY<0?1.12:.89)));
 renderZoom();
},{passive:false});
$("detailImage").addEventListener("load",()=>{if(selectedKind==="detail")renderZoom();});
