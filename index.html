<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mila Video</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090c;color:#fff;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{border:0;color:#fff;background:#20242d;border-radius:12px;padding:11px 15px}
button:active{transform:scale(.97)}
.hidden{display:none!important}
#app{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;width:100%;height:100%;overflow:auto}
.wrap{width:min(700px,calc(100% - 28px));margin:auto;padding:22px 0 40px}
.card{background:#11141a;border:1px solid #282d37;border-radius:18px;padding:16px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 18px}
h2{font-size:17px;margin:0 0 12px}
label{display:block;color:#8e95a3;font-size:12px;margin-bottom:6px}
input,textarea{width:100%;background:#0a0c10;color:#fff;border:1px solid #2a2f39;border-radius:11px;padding:12px;outline:none}
textarea{min-height:85px;resize:none}
.field{margin-bottom:13px}
.primary{background:#fff;color:#08090c;font-weight:700}
.err{height:20px;text-align:center;color:#ff6978;font-size:13px}
.top{
 position:sticky;top:0;z-index:30;height:58px;padding:8px 12px;
 display:flex;align-items:center;gap:8px;background:#090a0eeb;
 border-bottom:1px solid #222730;backdrop-filter:blur(12px)
}
.top .title{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700}
.icon{width:42px;height:42px;padding:0}
.desc{font-size:14px;color:#aeb4bf;line-height:1.5;white-space:pre-wrap}
.story{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:14px;background:#090a0d}
.story img{position:absolute;width:100%;height:100%;inset:0;object-fit:contain}
.storygrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.storygrid button{padding:0;background:transparent;border-radius:0;border:1px solid #ffffff08}
.storygrid button:active{background:#ffffff1c}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.actions button{flex:1;min-width:125px}
#lock{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#1b202b,#08090c 60%)}
.lockbox{width:min(390px,calc(100% - 32px));background:#11141a;border:1px solid #2a2f39;border-radius:22px;padding:25px}
.lockbox h1{text-align:center}
.locksub{text-align:center;color:#858c98;font-size:13px;margin:-8px 0 20px}
#storyViewer,#videoScreen,#tubeScreen{position:absolute;inset:0;z-index:100;background:#050609}
.viewer{position:absolute;inset:0;overflow:hidden;touch-action:none}
.viewer img{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:contain;transform-origin:center center;pointer-events:none;user-select:none}
.vback{position:absolute;z-index:20;left:12px;top:12px}
.vtitle{position:absolute;z-index:20;left:62px;right:62px;top:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:bold}
.vmenu{position:absolute;z-index:20;right:12px;top:12px}
.menu{
 position:absolute;z-index:25;right:12px;top:62px;width:min(285px,calc(100% - 24px));
 padding:8px;background:#15181fef;border:1px solid #303641;border-radius:16px;
 box-shadow:0 15px 50px #0009
}
.menu button{display:block;width:100%;text-align:left;background:transparent;margin:2px 0}
.menu button:active{background:#252a33}
.modebar{
 position:absolute;z-index:20;left:50%;bottom:14px;transform:translateX(-50%);
 display:flex;gap:4px;padding:5px;background:#15181feF;border:1px solid #303641;border-radius:15px
}
.modebar button{font-size:12px;padding:9px 12px;background:transparent}
.modebar button.active{background:#fff;color:#08090c;font-weight:bold}
.iframeWrap{position:absolute;inset:0;overflow:hidden;background:#000}
.iframeWrap iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:#000}
.blocker{position:absolute;inset:0;z-index:10;background:transparent}
.notice{
 position:absolute;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);
 width:min(440px,calc(100% - 30px));padding:22px;text-align:center;
 background:#14171e;border:1px solid #303641;border-radius:18px
}
.notice p{font-size:13px;color:#aeb4bf;line-height:1.5}
.cropOverlay{position:absolute;inset:0;z-index:40;background:#0009;display:none;touch-action:none}
.cropRect{position:absolute;border:2px solid #fff;background:#ffffff08;display:none}
.cropLabel{position:absolute;left:5px;top:5px;background:#000c;border-radius:6px;padding:4px 7px;font-size:11px}
.cropHelp{
 position:absolute;z-index:45;left:50%;top:12px;transform:translateX(-50%);
 padding:9px 12px;background:#15181fee;border:1px solid #343944;border-radius:12px;
 font-size:12px;white-space:nowrap
}
.cropControls{
 position:absolute;z-index:46;left:50%;bottom:14px;transform:translateX(-50%);
 display:flex;gap:6px;padding:6px;background:#15181ff0;border:1px solid #303641;border-radius:15px
}
.cropControls button{font-size:12px;padding:9px 12px}
#tubeScreen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#popup{
 position:absolute;z-index:200;right:10px;bottom:10px;
 width:min(48vw,310px);min-width:190px;
 background:#090b0f;border:1px solid #555b67;border-radius:15px;
 box-shadow:0 12px 50px #000c;overflow:hidden;
 touch-action:none
}
#popup .pophead{
 height:34px;display:flex;align-items:center;padding:0 7px;
 background:#15181f;cursor:move
}
#popup .poptitle{font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#popup .popclose{padding:4px 8px;border-radius:7px;font-size:11px}
#popupContent{position:relative;background:#000}
#popVideo{
 position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000
}
#popVideo iframe{
 position:absolute;border:0;background:#000;
 width:100%;height:100%;left:0;top:0
}
#popBar{
 position:relative;width:100%;height:25px;overflow:hidden;background:#000
}
#popBar iframe{
 position:absolute;border:0;background:#000;
 pointer-events:auto
}
#resizeHandle{
 position:absolute;right:0;bottom:0;width:22px;height:22px;
 cursor:nwse-resize;background:linear-gradient(135deg,transparent 45%,#fff 46%,#fff 55%,transparent 56%)
}
.tubeBack{
 position:absolute;z-index:20;left:10px;top:10px
}
#settings{
 position:absolute;z-index:300;inset:0;background:#08090cee;
 display:none;align-items:center;justify-content:center;padding:20px
}
.settingsBox{width:min(460px,100%);max-height:90%;overflow:auto;background:#15181f;border:1px solid #303641;border-radius:18px;padding:17px}
.small{font-size:12px;color:#8e95a3;line-height:1.5}
hr{border:0;border-top:1px solid #282d36;margin:15px 0}
</style>
</head>
<body>
<div id="app">

<section id="lock" class="screen">
 <div class="lockbox">
  <h1>Mila Video</h1>
  <div class="locksub">비밀번호를 입력하세요</div>
  <input id="pw" type="password" autocomplete="off" placeholder="비밀번호">
  <button id="enterBtn" class="primary" style="width:100%;margin-top:12px">입장</button>
  <div id="pwErr" class="err"></div>
 </div>
</section>

<section id="home" class="screen hidden">
 <div class="top">
  <div class="title">Mila Video</div>
  <button id="homeSave" class="icon">저장</button>
 </div>
 <div class="wrap">
  <div class="card">
   <div class="field">
    <label>영상 제목</label>
    <input id="titleInput" value="mila grant prison intake">
   </div>
   <div class="field">
    <label>영상 설명</label>
    <textarea id="descInput" placeholder="설명을 입력하세요"></textarea>
   </div>
  </div>

  <div class="card">
   <h2>Storyboard</h2>
   <div class="story">
    <img id="storyImg" src="storyboard.png" alt="storyboard">
    <div id="storyGrid" class="storygrid"></div>
   </div>
   <div class="small" style="margin-top:9px">10×10 총 100칸입니다. 원하는 칸을 누르면 해당 부분을 확대해서 볼 수 있습니다.</div>
  </div>

  <div class="actions">
   <button id="watchBtn" class="primary">영상 보기</button>
  </div>
 </div>
</section>

<section id="storyViewer" class="hidden">
 <button id="storyBack" class="vback">← 뒤로</button>
 <div id="storyCanvas" class="viewer">
  <img id="storySelected">
 </div>
</section>

<section id="videoScreen" class="hidden">
 <div id="videoFrame" class="iframeWrap">
  <iframe id="videoIframe"
   src="https://u.pcloud.link/publink/show?code=XZlxhzJZrigVSStpBFR7SU4aCsHBo01eFvFV"
   allow="autoplay; fullscreen; picture-in-picture"
   allowfullscreen></iframe>
 </div>

 <div id="videoBlocker" class="blocker hidden"></div>

 <div class="video-ui">
  <button id="videoBack" class="vback">←</button>
  <div class="vtitle" id="videoTitle">mila grant prison intake</div>
  <button id="videoMenuBtn" class="vmenu">☰</button>

  <div id="videoMenu" class="menu hidden">
   <button data-mode="click">🖱 클릭 모드</button>
   <button data-mode="zoom">🔍 확대 모드</button>
   <button data-mode="view">👁 보기 모드</button>
   <hr>
   <button id="cropStart">▣ 크롭 설정</button>
   <button id="cropClear">↩ 크롭 해제</button>
   <button id="popupTube">▣ 팝업 + rorotube</button>
   <button id="videoHome">⌂ 처음으로</button>
  </div>

  <div id="modebar" class="modebar">
   <button data-mode="click" class="active">클릭</button>
   <button data-mode="zoom">확대</button>
   <button data-mode="view">보기</button>
  </div>
 </div>

 <div id="cropOverlay" class="cropOverlay">
  <div id="cropRect" class="cropRect">
   <div id="cropLabel" class="cropLabel"></div>
  </div>
  <div id="cropHelp" class="cropHelp">1번 영상 영역을 드래그해서 지정하세요</div>
  <div class="cropControls">
   <button id="cropCancel">취소</button>
   <button id="cropNext">다음</button>
   <button id="cropSave" class="primary">저장</button>
  </div>
 </div>

 <div id="videoNotice" class="notice hidden">
  <h2>영상 표시 확인</h2>
  <p>pCloud가 외부 iframe 재생을 허용하지 않는 경우 브라우저에서 영상을 직접 표시할 수 없습니다.</p>
  <button id="openPcloud" class="primary">pCloud 영상 열기</button>
  <button id="closeNotice" style="margin-left:6px">닫기</button>
 </div>
</section>

<section id="tubeScreen" class="hidden">
 <button id="tubeBack" class="tubeBack">← Mila로 돌아가기</button>
 <iframe id="tubeIframe" src="about:blank"></iframe>

 <div id="popup" class="hidden">
  <div class="pophead" id="popHead">
   <div class="poptitle">mila grant prison intake</div>
   <button id="popClose" class="popclose">해제</button>
  </div>
  <div id="popupContent">
   <div id="popVideo">
    <iframe id="popVideoIframe"
     src="https://u.pcloud.link/publink/show?code=XZlxhzJZrigVSStpBFR7SU4aCsHBo01eFvFV"
     allow="autoplay; fullscreen; picture-in-picture"
     allowfullscreen></iframe>
   </div>
   <div id="popBar">
    <iframe id="popBarIframe"
     src="https://u.pcloud.link/publink/show?code=XZlxhzJZrigVSStpBFR7SU4aCsHBo01eFvFV"
     allow="autoplay; fullscreen; picture-in-picture"></iframe>
   </div>
  </div>
  <div id="resizeHandle"></div>
 </div>
</section>

<section id="settings">
 <div class="settingsBox">
  <h2>설정</h2>
  <div class="small">영상 제목과 설명은 메인 화면에서 저장합니다.</div>
  <hr>
  <button id="settingsClose" style="width:100%">닫기</button>
 </div>
</section>

</div>

<script>
(function(){
"use strict";

const VIDEO_URL="https://u.pcloud.link/publink/show?code=XZlxhzJZrigVSStpBFR7SU4aCsHBo01eFvFV";
const TUBE_URL="https://rorotube.val.run";
const PASSWORD="mila130102!";

const $=id=>document.getElementById(id);

const state={
 title:"mila grant prison intake",
 desc:"",
 mode:"click",
 crop:null,
 cropStep:0,
 cropStart:null,
 cropTemp:null,
 popup:false
};

function safeGet(k,d){
 try{
  const v=localStorage.getItem(k);
  return v===null?d:JSON.parse(v);
 }catch(e){return d}
}
function safeSet(k,v){
 try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}
}
function loadState(){
 state.title=safeGet("mila_title","mila grant prison intake");
 state.desc=safeGet("mila_desc","");
 state.crop=safeGet("mila_crop",null);
 $("titleInput").value=state.title;
 $("descInput").value=state.desc;
}
function saveState(){
 state.title=$("titleInput").value.trim()||"mila grant prison intake";
 state.desc=$("descInput").value;
 safeSet("mila_title",state.title);
 safeSet("mila_desc",state.desc);
 safeSet("mila_crop",state.crop);
 updateTitle();
}
function show(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.add("hidden"));
 $(id).classList.remove("hidden");
}
function updateTitle(){
 $("videoTitle").textContent=state.title;
 document.querySelector(".poptitle").textContent=state.title;
}

loadState();

$("enterBtn").onclick=()=>{
 if($("pw").value===PASSWORD){
  sessionStorage.setItem("mila_auth","1");
  $("pwErr").textContent="";
  show("home");
 }else{
  $("pwErr").textContent="비밀번호가 올바르지 않습니다.";
 }
};
$("pw").addEventListener("keydown",e=>{
 if(e.key==="Enter")$("enterBtn").click();
});

if(sessionStorage.getItem("mila_auth")==="1")show("home");

$("homeSave").onclick=()=>{
 saveState();
 const b=$("homeSave");
 b.textContent="저장됨";
 setTimeout(()=>b.textContent="저장",900);
};

const grid=$("storyGrid");
for(let i=0;i<100;i++){
 const b=document.createElement("button");
 b.dataset.i=i;
 b.title=(i+1)+"번";
 b.onclick=()=>openStory(i);
 grid.appendChild(b);
}

let storyScale=1,storyX=0,storyY=0,storyPointers=new Map(),storyBaseDist=0,storyBaseScale=1,storyBaseX=0,storyBaseY=0;

function openStory(i){
 const row=Math.floor(i/10),col=i%10;
 const img=$("storySelected");
 img.src="storyboard.png";
 img.style.clipPath="none";
 img.style.width="1000%";
 img.style.height="1000%";
 img.style.left=(-col*100)+"%";
 img.style.top=(-row*100)+"%";
 img.style.objectFit="fill";
 img.dataset.col=col;
 img.dataset.row=row;
 storyScale=1;storyX=0;storyY=0;
 applyStoryTransform();
 show("storyViewer");
}
function applyStoryTransform(){
 const img=$("storySelected");
 img.style.transform=`translate(calc(-${$("storySelected").dataset.col*100}% + ${storyX}px),calc(-${$("storySelected").dataset.row*100}% + ${storyY}px)) scale(${storyScale})`;
}
function dist(a,b){
 return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)
}
function midpoint(a,b){
 return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}
}

$("storyCanvas").addEventListener("pointerdown",e=>{
 storyPointers.set(e.pointerId,e);
 e.currentTarget.setPointerCapture?.(e.pointerId);
 if(storyPointers.size===2){
  const a=[...storyPointers.values()];
  storyBaseDist=dist(a[0],a[1]);
  storyBaseScale=storyScale;
  storyBaseX=storyX;storyBaseY=storyY;
 }
});
$("storyCanvas").addEventListener("pointermove",e=>{
 if(!storyPointers.has(e.pointerId))return;
 storyPointers.set(e.pointerId,e);
 const a=[...storyPointers.values()];
 if(a.length===2){
  const d=dist(a[0],a[1]);
  storyScale=Math.max(.8,Math.min(8,storyBaseScale*d/storyBaseDist));
 }else if(a.length===1){
  const dx=e.movementX||0,dy=e.movementY||0;
  storyX+=dx;storyY+=dy;
 }
 applyStoryTransform();
});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>{
 $("storyCanvas").addEventListener(ev,e=>storyPointers.delete(e.pointerId));
});
$("storyBack").onclick=()=>show("home");

$("watchBtn").onclick=()=>{
 show("videoScreen");
 updateTitle();
 setMode("click");
 applyCrop();
};

$("videoBack").onclick=()=>{
 $("videoMenu").classList.add("hidden");
 $("cropOverlay").style.display="none";
 show("home");
};

$("videoMenuBtn").onclick=()=>{
 $("videoMenu").classList.toggle("hidden");
};

document.querySelectorAll("[data-mode]").forEach(b=>{
 b.onclick=()=>{
  setMode(b.dataset.mode);
  $("videoMenu").classList.add("hidden");
 };
});

function setMode(mode){
 state.mode=mode;
 document.querySelectorAll(".modebar button").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
 if(mode==="click"){
  $("videoBlocker").classList.add("hidden");
 }else{
  $("videoBlocker").classList.remove("hidden");
 }
}

let zoomScale=1,zoomX=0,zoomY=0;
let vp=new Map(),pinchDist=0,pinchScale=1,pinchX=0,pinchY=0;

$("videoBlocker").addEventListener("pointerdown",e=>{
 if(state.mode!=="zoom")return;
 vp.set(e.pointerId,e);
 e.currentTarget.setPointerCapture?.(e.pointerId);
 if(vp.size===2){
  const a=[...vp.values()];
  pinchDist=dist(a[0],a[1]);
  pinchScale=zoomScale;
  pinchX=zoomX;pinchY=zoomY;
 }
});
$("videoBlocker").addEventListener("pointermove",e=>{
 if(state.mode!=="zoom"||!vp.has(e.pointerId))return;
 vp.set(e.pointerId,e);
 const a=[...vp.values()];
 if(a.length===2){
  const d=dist(a[0],a[1]);
  zoomScale=Math.max(1,Math.min(50,pinchScale*d/pinchDist));
 }else if(a.length===1){
  zoomX+=e.movementX||0;
  zoomY+=e.movementY||0;
 }
 applyVideoZoom();
});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>{
 $("videoBlocker").addEventListener(ev,e=>vp.delete(e.pointerId));
});
function applyVideoZoom(){
 const f=$("videoIframe");
 const s=zoomScale;
 f.style.width=(s*100)+"%";
 f.style.height=(s*100)+"%";
 f.style.left=((100-s*100)/2+zoomX/innerWidth*100)+"%";
 f.style.top=((100-s*100)/2+zoomY/innerHeight*100)+"%";
}

$("cropStart").onclick=startCrop;
$("cropClear").onclick=()=>{
 state.crop=null;
 safeSet("mila_crop",null);
 resetIframe();
 $("videoMenu").classList.add("hidden");
};

function resetIframe(){
 const f=$("videoIframe");
 f.style.width="100%";
 f.style.height="100%";
 f.style.left="0";
 f.style.top="0";
 zoomScale=1;zoomX=0;zoomY=0;
 applyCrop();
}

let cropPoints=[];
let cropDrawing=false;
let cropStartX=0,cropStartY=0;

function startCrop(){
 $("videoMenu").classList.add("hidden");
 cropPoints=[];
 state.cropTemp=[];
 state.cropStep=0;
 $("cropOverlay").style.display="block";
 $("cropRect").style.display="none";
 $("cropHelp").textContent="1번 영상 영역을 드래그해서 지정하세요";
}

function pointerPos(e){
 const r=$("cropOverlay").getBoundingClientRect();
 return {
  x:Math.max(0,Math.min(r.width,e.clientX-r.left)),
  y:Math.max(0,Math.min(r.height,e.clientY-r.top))
 };
}

$("cropOverlay").addEventListener("pointerdown",e=>{
 if(e.target.closest(".cropControls"))return;
 cropDrawing=true;
 const p=pointerPos(e);
 cropStartX=p.x;cropStartY=p.y;
 drawRect(p.x,p.y,p.x,p.y);
 $("cropOverlay").setPointerCapture?.(e.pointerId);
});
$("cropOverlay").addEventListener("pointermove",e=>{
 if(!cropDrawing)return;
 const p=pointerPos(e);
 drawRect(cropStartX,cropStartY,p.x,p.y);
});
$("cropOverlay").addEventListener("pointerup",e=>{
 if(!cropDrawing)return;
 cropDrawing=false;
 const p=pointerPos(e);
 let x=Math.min(cropStartX,p.x),y=Math.min(cropStartY,p.y);
 let w=Math.abs(p.x-cropStartX),h=Math.abs(p.y-cropStartY);
 if(w<15||h<10){
  $("cropRect").style.display="none";
  return;
 }
 const r=$("cropOverlay").getBoundingClientRect();
 state.cropTemp[state.cropStep]={x:x/r.width,y:y/r.height,w:w/r.width,h:h/r.height};
});
function drawRect(x1,y1,x2,y2){
 const x=Math.min(x1,x2),y=Math.min(y1,y2);
 const w=Math.abs(x2-x1),h=Math.abs(y2-y1);
 const r=$("cropRect");
 r.style.display="block";
 r.style.left=x+"px";r.style.top=y+"px";
 r.style.width=w+"px";r.style.height=h+"px";
 $("cropLabel").textContent=(state.cropStep+1)+". "+["영상","영상 길이 바","설정 바"][state.cropStep];
}
$("cropNext").onclick=()=>{
 if(!state.cropTemp[state.cropStep]){
  alert("먼저 직사각형 영역을 지정하세요.");
  return;
 }
 if(state.cropStep<2){
  state.cropStep++;
  $("cropRect").style.display="none";
  $("cropHelp").textContent=(state.cropStep+1)+"번 "+["영상","영상 길이 바","설정 바"][state.cropStep]+" 영역을 드래그해서 지정하세요";
 }else{
  saveCrop();
 }
};
$("cropSave").onclick=()=>{
 if(state.cropTemp.length===3)saveCrop();
 else alert("3개의 영역을 모두 지정하세요.");
};
$("cropCancel").onclick=()=>{
 $("cropOverlay").style.display="none";
 state.cropTemp=[];
};

function saveCrop(){
 state.crop=JSON.parse(JSON.stringify(state.cropTemp));
 safeSet("mila_crop",state.crop);
 $("cropOverlay").style.display="none";
 state.cropTemp=[];
 applyCrop();
 alert("크롭 설정이 저장되었습니다.");
}

function applyCrop(){
 if(!state.crop||state.crop.length!==3){
  $("videoFrame").style.clipPath="none";
  return;
 }
 /*
  cross-origin iframe 내부 DOM을 직접 읽을 수 없으므로
  저장한 좌표를 기준으로 iframe 전체를 표시하는 컨테이너 구조를 사용한다.
 */
 $("videoFrame").style.clipPath="none";
}

$("popupTube").onclick=()=>{
 if(!state.crop||state.crop.length!==3){
  alert("팝업을 사용하려면 먼저 3개의 크롭 영역을 저장하세요.");
  return;
 }
 $("videoMenu").classList.add("hidden");
 show("tubeScreen");
 $("tubeIframe").src=TUBE_URL;
 openPopup();
};

$("videoHome").onclick=()=>{
 $("videoMenu").classList.add("hidden");
 show("home");
};

$("openPcloud").onclick=()=>window.open(VIDEO_URL,"_blank");
$("closeNotice").onclick=()=>$("videoNotice").classList.add("hidden");

$("tubeBack").onclick=()=>{
 $("tubeIframe").src="about:blank";
 closePopup();
 show("videoScreen");
};

function openPopup(){
 $("popup").classList.remove("hidden");
 updatePopup();
}
function closePopup(){
 $("popup").classList.add("hidden");
 state.popup=false;
}
$("popClose").onclick=closePopup;

function updatePopup(){
 const c=state.crop;
 if(!c||c.length!==3)return;

 const popup=$("popup");
 const width=popup.getBoundingClientRect().width;
 const v=c[0];
 const ratio=v.w/v.h;
 const videoH=width/ratio;

 $("popVideo").style.height=videoH+"px";

 /*
  팝업 영상은 저장된 1번 크롭 영역을 기준으로 축소.
  팝업 아래의 2번 영역은 별도 progress bar가 아니라
  저장된 실제 iframe 화면 영역을 축소해서 표시한다.
 */
 positionCroppedIframe($("popVideoIframe"),c[0],width,videoH);
 positionCroppedIframe($("popBarIframe"),c[1],width,25);
}
function positionCroppedIframe(frame,crop,targetW,targetH){
 const sourceW=innerWidth;
 const sourceH=innerHeight;
 const sx=targetW/(crop.w*sourceW);
 const sy=targetH/(crop.h*sourceH);
 const s=Math.min(sx,sy);
 frame.style.width=(sourceW*s)+"px";
 frame.style.height=(sourceH*s)+"px";
 frame.style.left=(-crop.x*sourceW*s)+"px";
 frame.style.top=(-crop.y*sourceH*s)+"px";
}

let drag=false,dragDX=0,dragDY=0;
$("popHead").addEventListener("pointerdown",e=>{
 drag=true;
 const r=$("popup").getBoundingClientRect();
 dragDX=e.clientX-r.left;
 dragDY=e.clientY-r.top;
 $("popHead").setPointerCapture?.(e.pointerId);
});
$("popHead").addEventListener("pointermove",e=>{
 if(!drag)return;
 const p=$("popup");
 let x=e.clientX-dragDX;
 let y=e.clientY-dragDY;
 x=Math.max(0,Math.min(innerWidth-p.offsetWidth,x));
 y=Math.max(0,Math.min(innerHeight-p.offsetHeight,y));
 p.style.left=x+"px";
 p.style.right="auto";
 p.style.top=y+"px";
 p.style.bottom="auto";
});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>{
 $("popHead").addEventListener(ev,()=>drag=false);
});

let resizing=false,rStartX=0,rStartY=0,rStartW=0,rStartH=0;
$("resizeHandle").addEventListener("pointerdown",e=>{
 e.stopPropagation();
 resizing=true;
 const r=$("popup").getBoundingClientRect();
 rStartX=e.clientX;rStartY=e.clientY;rStartW=r.width;rStartH=r.height;
 $("resizeHandle").setPointerCapture?.(e.pointerId);
});
$("resizeHandle").addEventListener("pointermove",e=>{
 if(!resizing)return;
 const popup=$("popup");
 let nw=Math.max(190,rStartW+(e.clientX-rStartX));
 nw=Math.min(innerWidth-20,nw);
 popup.style.width=nw+"px";
 updatePopup();
});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>{
 $("resizeHandle").addEventListener(ev,()=>resizing=false);
});

window.addEventListener("resize",()=>{
 if(!$("popup").classList.contains("hidden"))updatePopup();
});

$("titleInput").addEventListener("input",updateTitle);
$("descInput").addEventListener("input",()=>state.desc=$("descInput").value);

window.addEventListener("message",e=>{
 /*
  iframe의 실제 로딩 실패/차단 여부를 페이지 내부에서
  안정적으로 감지할 수 없는 경우가 있으므로 별도의
  강제 검은 화면 판정은 하지 않는다.
 */
});

$("videoIframe").addEventListener("load",()=>{
 $("videoNotice").classList.add("hidden");
});

$("videoIframe").addEventListener("error",()=>{
 $("videoNotice").classList.remove("hidden");
});

window.addEventListener("popstate",()=>{
 if(!$("storyViewer").classList.contains("hidden"))show("home");
 else if(!$("videoScreen").classList.contains("hidden"))show("home");
 else if(!$("tubeScreen").classList.contains("hidden")){
  closePopup();
  show("home");
 }
});

updateTitle();

})();
</script>
