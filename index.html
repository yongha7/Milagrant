<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mila Video</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#f5f6fa;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{background:#1b2130;color:#f5f6fa;border:1px solid #394156;border-radius:9px;padding:8px 11px;min-height:37px;cursor:pointer}
button:active{filter:brightness(1.2)}
button.active{background:#6255df;border-color:#8c80ff}
button:disabled{opacity:.35}
input,textarea{width:100%;padding:10px;background:#101622;color:#fff;border:1px solid #394156;border-radius:8px}
.small{font-size:12px;color:#aeb8cd;line-height:1.5}
#gate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#090b10;padding:18px}
.gatebox{width:min(360px,100%);padding:24px;background:#141a26;border:1px solid #323b50;border-radius:16px}
#app{display:none;height:100%;height:100dvh;flex-direction:column}
header{flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#111621;border-bottom:1px solid #2b3242;min-height:45px}
.brand{font-size:12px;font-weight:800;white-space:nowrap;letter-spacing:.6px}
#headerTitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c5ccdc;font-size:13px}
#videoScreen{display:flex;flex:1;min-height:0;flex-direction:column;background:#000}
#videoStage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;touch-action:auto}
#videoClip{position:absolute;inset:0;overflow:hidden;clip-path:none;-webkit-clip-path:none}
#videoTransform{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#videoFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#cropOverlay{position:absolute;inset:0;z-index:20;display:none;touch-action:none;cursor:crosshair}
#cropOverlay.on{display:block}
#cropShade{position:absolute;inset:0;background:#0003;pointer-events:none}
#cropBox{position:absolute;border:2px solid #a99cff;background:#8a7cff20;display:none;pointer-events:none;box-shadow:0 0 0 9999px #0008}
#cropHint{position:absolute;z-index:21;top:8px;left:8px;right:8px;padding:8px;text-align:center;background:#171a28ed;border:1px solid #7165ce;border-radius:8px;font-size:12px;display:none;pointer-events:none}
#description{flex:none;padding:6px 10px;background:#111621;color:#b7c0d2;font-size:12px;white-space:pre-wrap;max-height:45px;overflow:auto}
#bottomBar{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;padding:7px;background:#111621;border-top:1px solid #2b3242}
#bottomBar button{font-size:12px;padding:7px 9px;min-height:35px}
.panel{position:fixed;inset:0;z-index:60;background:#000b;display:none;align-items:center;justify-content:center;padding:14px}
.panel.show{display:flex}
.dialog{width:min(520px,100%);max-height:92%;overflow:auto;background:#151b28;border:1px solid #394156;border-radius:15px;padding:16px}
.field{margin:12px 0}
.field label{display:block;margin-bottom:6px;font-size:12px;color:#bbc5d8}
.row{display:flex;gap:8px;margin-top:10px}
.row>*{flex:1;min-width:0}
hr{border-color:#30384a;margin:18px 0}
#storyboardScreen{position:fixed;inset:0;z-index:30;background:#090c12;display:none;flex-direction:column}
#storyboardScreen.show{display:flex}
.storyhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;background:#141a26;border-bottom:1px solid #2d3546}
.storyhead strong{flex:1;min-width:100px;font-size:14px}
#storyCounter{font-size:12px;color:#bfc8da;white-space:nowrap}
#storyTabs{display:flex;gap:6px;padding:7px;background:#101520}
#storyTabs button{flex:1;font-size:12px}
#storyGrid{flex:1;min-height:0;overflow:auto;padding:8px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-content:start}
.storyCell{position:relative;display:block;aspect-ratio:1;min-width:0;overflow:hidden;padding:0;border-radius:6px;background:#171d29;border:1px solid #394156}
.storyCell canvas,.storyCell img{display:block;width:100%;height:100%;object-fit:contain}
.storyCell span{position:absolute;left:0;right:0;bottom:0;padding:3px;background:#000b;font-size:10px;text-align:center;pointer-events:none}
.storyCell.selected{border:2px solid #a497ff}
#storyMessage{padding:6px 10px;background:#111621;color:#aeb8cd;font-size:11px}
#detailScreen{position:fixed;inset:0;z-index:40;background:#050608;display:none;flex-direction:column}
#detailScreen.show{display:flex}
.detailhead{flex:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;background:#111621}
#detailTitle{flex:1;min-width:70px;font-size:13px}
#detailCounter{font-size:12px;color:#bdc6d8;white-space:nowrap}
#detailViewport{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#050608;touch-action:none}
#detailCanvas,#detailImage{position:absolute;left:0;top:0;display:none;max-width:none;max-height:none;transform-origin:0 0;touch-action:none;user-select:none;-webkit-user-drag:none}
.detailnav{flex:none;display:flex;justify-content:center;gap:8px;padding:8px;background:#111621}
.detailnav button{flex:1;max-width:230px}
@media(min-width:650px){#storyGrid{grid-template-columns:repeat(10,minmax(0,1fr))}}
</style>
</head>
<body>

<div id="gate">
 <div class="gatebox">
  <h2 style="margin-top:0">Mila Video</h2>
  <p class="small">비밀번호를 입력해야 앱에 들어갈 수 있습니다.</p>
  <input id="passwordInput" type="password" placeholder="비밀번호" autocomplete="off">
  <div class="row"><button id="unlockBtn" class="active">입장</button></div>
  <p id="gateError" class="small"></p>
 </div>
</div>

<div id="app">
 <header>
  <span class="brand">MILA VIDEO</span>
  <span id="headerTitle">mila grant prison intake</span>
  <button id="menuBtn">설정</button>
 </header>
 <main id="videoScreen">
  <div id="videoStage">
   <div id="videoClip">
    <div id="videoTransform">
     <iframe id="videoFrame"
      src="https://u.pcloud.link/publink/show?code=XZlxhzJZrigVSStpBFR7SU4aCsHBo01eFvFV"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
   </div>
   <div id="cropOverlay">
    <div id="cropShade"></div>
    <div id="cropBox"></div>
   </div>
   <div id="cropHint">영상 위에서 원하는 크롭 영역을 드래그하세요.</div>
  </div>
  <div id="description"></div>
  <div id="bottomBar">
   <button id="clickMode" class="active">클릭</button>
   <button id="zoomMode">확대</button>
   <button id="viewMode">보기</button>
   <button id="resetVideoZoom">확대 초기화</button>
   <button id="cropBtn">크롭 설정</button>
   <button id="storyBtn">스토리보드</button>
  </div>
 </main>
</div>

<div class="panel" id="settingsPanel">
 <div class="dialog">
  <h3 style="margin-top:0">설정</h3>
  <div class="field"><label>영상 제목</label><input id="titleInput" value="mila grant prison intake"></div>
  <div class="field"><label>영상 설명</label><textarea id="descInput" rows="3" placeholder="설명을 입력하세요."></textarea></div>
  <div class="row"><button id="saveTextBtn" class="active">제목·설명 저장</button><button id="closeSettingsBtn">닫기</button></div>
  <hr>
  <h3>크롭 설정</h3>
  <p class="small">영역 지정을 누른 다음 영상 화면에서 사각형을 드래그하세요. 지정한 사각형만 보이도록 적용합니다.</p>
  <div class="row"><button id="startCropBtn" class="active">영역 지정</button><button id="applyCropBtn">크롭 적용</button></div>
  <div class="row"><button id="resetCropBtn">크롭 초기화</button><button id="closeSettingsBtn2">닫기</button></div>
  <p id="cropStatus" class="small"></p>
 </div>
</div>

<div id="storyboardScreen">
 <div class="storyhead">
  <strong id="storyHeaderTitle">메인 스토리보드</strong>
  <span id="storyCounter">1 / 100</span>
  <button id="storyPrev">◀</button>
  <button id="storyNext" class="active">▶</button>
  <button id="closeStoryBtn">닫기</button>
 </div>
 <div id="storyTabs">
  <button id="mainTab" class="active">메인 100개</button>
  <button id="fullTab">원본 전체 보기</button>
  <button id="detailTab">세부 20장</button>
 </div>
 <div id="storyGrid"></div>
 <div id="storyMessage">storyboard.png의 10×10 칸을 개별 이미지로 표시합니다.</div>
</div>

<div id="detailScreen">
 <div class="detailhead">
  <button id="detailBack">목록</button>
  <strong id="detailTitle">이미지</strong>
  <span id="detailCounter">1 / 100</span>
  <button id="detailReset">초기화</button>
  <button id="detailClose">닫기</button>
 </div>
 <div id="detailViewport">
  <canvas id="detailCanvas"></canvas>
  <img id="detailImage" alt="스토리보드 이미지">
 </div>
 <div class="detailnav">
  <button id="detailPrev">◀ 이전</button>
  <button id="detailNext" class="active">다음 ▶</button>
 </div>
</div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const STORAGE_KEY="mila_video_app_final_v5";
let old={};
try{old=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")||{};}catch(e){}
const data={
 title:old.title||"mila grant prison intake",
 description:old.description||"",
 crop:old.crop||null,
 mode:old.mode||"click"
};
function save(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}
 catch(e){console.warn("저장 공간에 접근할 수 없습니다.",e);}
}

/* 인증 */
$("unlockBtn").addEventListener("click",unlock);
$("passwordInput").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
function unlock(){
 if($("passwordInput").value!=="mila130102!"){
  $("gateError").textContent="비밀번호가 올바르지 않습니다.";
  return;
 }
 $("gate").style.display="none";
 $("app").style.display="flex";
 $("titleInput").value=data.title;
 $("descInput").value=data.description;
 $("headerTitle").textContent=data.title;
 $("description").textContent=data.description;
 setMode(data.mode);
 applyCrop();
}
$("menuBtn").addEventListener("click",()=>{
 $("settingsPanel").classList.add("show");
 updateCropStatus();
});
function closeSettings(){$("settingsPanel").classList.remove("show");}
$("closeSettingsBtn").addEventListener("click",closeSettings);
$("closeSettingsBtn2").addEventListener("click",closeSettings);
$("saveTextBtn").addEventListener("click",()=>{
 data.title=$("titleInput").value.trim()||"Mila Video";
 data.description=$("descInput").value;
 $("headerTitle").textContent=data.title;
 $("description").textContent=data.description;
 save();
});

/* 영상 모드 및 확대·이동 */
let videoScale=1,videoX=0,videoY=0;
const videoPointers=new Map();
let videoPinch=null;
function renderVideoTransform(){
 $("videoTransform").style.transform=
  `translate(${videoX}px,${videoY}px) scale(${videoScale})`;
}
function resetVideoZoom(){
 videoScale=1;videoX=0;videoY=0;renderVideoTransform();
}
$("resetVideoZoom").addEventListener("click",resetVideoZoom);

function setMode(mode){
 data.mode=mode;
 $("clickMode").classList.toggle("active",mode==="click");
 $("zoomMode").classList.toggle("active",mode==="zoom");
 $("viewMode").classList.toggle("active",mode==="view");
 $("videoFrame").style.pointerEvents=mode==="click"&&!cropOn?"auto":"none";
 $("videoStage").style.touchAction=mode==="zoom"?"none":"auto";
 save();
}
$("clickMode").addEventListener("click",()=>setMode("click"));
$("zoomMode").addEventListener("click",()=>setMode("zoom"));
$("viewMode").addEventListener("click",()=>setMode("view"));

$("videoStage").addEventListener("pointerdown",e=>{
 if(data.mode!=="zoom"||cropOn)return;
 e.preventDefault();
 try{$("videoStage").setPointerCapture(e.pointerId);}catch(_){}
 videoPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(videoPointers.size===2){
  const p=[...videoPointers.values()];
  const rect=$("videoStage").getBoundingClientRect();
  const cx=((p[0].x+p[1].x)/2)-rect.left;
  const cy=((p[0].y+p[1].y)/2)-rect.top;
  videoPinch={
   distance:Math.max(1,Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)),
   scale:videoScale,x:videoX,y:videoY,cx,cy
  };
 }
});
$("videoStage").addEventListener("pointermove",e=>{
 if(data.mode!=="zoom"||cropOn||!videoPointers.has(e.pointerId))return;
 e.preventDefault();
 const oldPoint=videoPointers.get(e.pointerId);
 videoPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(videoPointers.size>=2&&videoPinch){
  const p=[...videoPointers.values()];
  const rect=$("videoStage").getBoundingClientRect();
  const distance=Math.max(1,Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y));
  const cx=((p[0].x+p[1].x)/2)-rect.left;
  const cy=((p[0].y+p[1].y)/2)-rect.top;
  const newScale=Math.max(1,Math.min(30,videoPinch.scale*distance/videoPinch.distance));
  const ratio=newScale/videoPinch.scale;
  videoX=cx-(videoPinch.cx-videoPinch.x)*ratio;
  videoY=cy-(videoPinch.cy-videoPinch.y)*ratio;
  videoScale=newScale;
 }else{
  videoX+=e.clientX-oldPoint.x;
  videoY+=e.clientY-oldPoint.y;
 }
 renderVideoTransform();
});
function endVideoPointer(e){
 videoPointers.delete(e.pointerId);
 if(videoPointers.size<2)videoPinch=null;
}
$("videoStage").addEventListener("pointerup",endVideoPointer);
$("videoStage").addEventListener("pointercancel",endVideoPointer);
$("videoStage").addEventListener("lostpointercapture",endVideoPointer);

/* 크롭: iframe 위의 독립 입력 레이어에서 영역을 선택 */
let cropOn=false,cropStart=null,cropTemp=null;
function stagePoint(e){
 const r=$("videoStage").getBoundingClientRect();
 return {
  x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),
  y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))
 };
}
function startCrop(){
 closeSettings();
 cropOn=true;cropStart=null;cropTemp=null;
 $("cropOverlay").classList.add("on");
 $("cropHint").style.display="block";
 $("cropBox").style.display="none";
 $("videoFrame").style.pointerEvents="none";
 $("videoStage").style.touchAction="none";
}
$("cropBtn").addEventListener("click",startCrop);
$("startCropBtn").addEventListener("click",startCrop);

$("cropOverlay").addEventListener("pointerdown",e=>{
 if(!cropOn)return;
 e.preventDefault();e.stopPropagation();
 try{$("cropOverlay").setPointerCapture(e.pointerId);}catch(_){}
 cropStart=stagePoint(e);
 cropTemp={x:cropStart.x,y:cropStart.y,w:0,h:0};
 drawCrop();
});
$("cropOverlay").addEventListener("pointermove",e=>{
 if(!cropOn||!cropStart)return;
 e.preventDefault();
 const p=stagePoint(e);
 cropTemp={
  x:Math.min(cropStart.x,p.x),
  y:Math.min(cropStart.y,p.y),
  w:Math.abs(p.x-cropStart.x),
  h:Math.abs(p.y-cropStart.y)
 };
 drawCrop();
});
function drawCrop(){
 if(!cropTemp)return;
 const r=$("videoStage").getBoundingClientRect();
 const b=$("cropBox"),c=cropTemp;
 b.style.display="block";
 b.style.left=(c.x*r.width)+"px";
 b.style.top=(c.y*r.height)+"px";
 b.style.width=(c.w*r.width)+"px";
 b.style.height=(c.h*r.height)+"px";
}
function finishCrop(){
 if(!cropOn)return;
 if(cropTemp&&cropTemp.w>.015&&cropTemp.h>.015){
  data.crop={...cropTemp};
  save();
 }
 cropOn=false;cropStart=null;cropTemp=null;
 $("cropOverlay").classList.remove("on");
 $("cropHint").style.display="none";
 $("cropBox").style.display="none";
 $("videoStage").style.touchAction=data.mode==="zoom"?"none":"auto";
 $("videoFrame").style.pointerEvents=data.mode==="click"?"auto":"none";
 applyCrop();updateCropStatus();
}
$("cropOverlay").addEventListener("pointerup",finishCrop);
$("cropOverlay").addEventListener("pointercancel",finishCrop);
$("applyCropBtn").addEventListener("click",()=>{
 if(cropTemp&&cropTemp.w>.015&&cropTemp.h>.015){
  data.crop={...cropTemp};
 }
 if(!data.crop){
  $("cropStatus").textContent="영역을 먼저 지정하세요.";
  return;
 }
 cropOn=false;cropStart=null;cropTemp=null;
 $("cropOverlay").classList.remove("on");
 $("cropHint").style.display="none";
 $("cropBox").style.display="none";
 applyCrop();save();updateCropStatus();closeSettings();
});
function applyCrop(){
 const clip=$("videoClip"),c=data.crop;
 if(!c){
  clip.style.clipPath="none";
  clip.style.webkitClipPath="none";
  return;
 }
 const x=Math.max(0,Math.min(1,c.x));
 const y=Math.max(0,Math.min(1,c.y));
 const w=Math.max(0,Math.min(1-x,c.w));
 const h=Math.max(0,Math.min(1-y,c.h));
 clip.style.clipPath=`inset(${y*100}% ${(1-x-w)*100}% ${(1-y-h)*100}% ${x*100}%)`;
 clip.style.webkitClipPath=clip.style.clipPath;
}
$("resetCropBtn").addEventListener("click",()=>{
 data.crop=null;cropOn=false;cropStart=null;cropTemp=null;
 $("cropOverlay").classList.remove("on");
 $("cropHint").style.display="none";$("cropBox").style.display="none";
 $("videoFrame").style.pointerEvents=data.mode==="click"?"auto":"none";
 applyCrop();save();updateCropStatus();
});
function updateCropStatus(){
 $("cropStatus").textContent=data.crop?"크롭 영역이 저장되어 적용 중입니다.":"크롭 영역이 지정되지 않았습니다.";
}

/* 메인 스토리보드 원본 */
const sprite=new Image();
let spriteLoaded=false,spriteFailed=false;
sprite.onload=()=>{
 spriteLoaded=true;spriteFailed=false;
 if($("storyboardScreen").classList.contains("show"))renderStory();
 if($("detailScreen").classList.contains("show")&&detailKind==="main")renderDetailImage();
};
sprite.onerror=()=>{
 spriteFailed=true;spriteLoaded=false;
 if($("storyboardScreen").classList.contains("show"))renderStory();
};
sprite.src="storyboard.png";

let storyMode="main",mainIndex=0,detailIndex=1;
let detailKind="main"; // main, detail, full
$("storyBtn").addEventListener("click",()=>{
 $("storyboardScreen").classList.add("show");
 storyMode="main";
 renderStory();
});
$("closeStoryBtn").addEventListener("click",()=>$("storyboardScreen").classList.remove("show"));
$("mainTab").addEventListener("click",()=>{storyMode="main";renderStory();});
$("fullTab").addEventListener("click",()=>openFullSprite());
$("detailTab").addEventListener("click",()=>{storyMode="detail";renderStory();});

function renderStory(){
 const grid=$("storyGrid");
 $("mainTab").classList.toggle("active",storyMode==="main");
 $("fullTab").classList.remove("active");
 $("detailTab").classList.toggle("active",storyMode==="detail");
 $("storyHeaderTitle").textContent=storyMode==="main"?"메인 스토리보드":"세부 스토리보드";
 $("storyCounter").textContent=storyMode==="main"?(mainIndex+1)+" / 100":detailIndex+" / 20";
 $("storyPrev").style.display=storyMode==="main"||storyMode==="detail"?"":"none";
 $("storyNext").style.display=storyMode==="main"||storyMode==="detail"?"":"none";
 $("storyMessage").textContent=storyMode==="main"
  ?"storyboard.png를 10×10으로 나눠 100개를 각각 선택할 수 있습니다."
  :"storyboard_0001.jpg부터 storyboard_0020.jpg까지 20장을 표시합니다.";
 grid.style.gridTemplateColumns=window.innerWidth>=650
  ?(storyMode==="main"?"repeat(10,minmax(0,1fr))":"repeat(5,minmax(0,1fr))")
  :(storyMode==="main"?"repeat(5,minmax(0,1fr))":"repeat(3,minmax(0,1fr))");
 if(storyMode==="main")buildMainGrid(grid);
 else buildDetailGrid(grid);
}
function buildMainGrid(grid){
 grid.innerHTML="";
 for(let i=0;i<100;i++){
  const btn=document.createElement("button");
  btn.className="storyCell"+(i===mainIndex?" selected":"");
  const canvas=document.createElement("canvas");
  canvas.width=240;canvas.height=240;
  const ctx=canvas.getContext("2d");
  if(spriteLoaded){
   const W=sprite.naturalWidth,H=sprite.naturalHeight;
   const sx=i%10,sy=Math.floor(i/10);
   const left=sx*W/10,top=sy*H/10;
   const right=(sx+1)*W/10,bottom=(sy+1)*H/10;
   ctx.drawImage(sprite,left,top,right-left,bottom-top,0,0,240,240);
  }else{
   ctx.fillStyle="#1b2230";ctx.fillRect(0,0,240,240);
   ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="44px Arial";
   ctx.fillText(String(i+1),120,130);
   if(spriteFailed){ctx.font="20px Arial";ctx.fillText("이미지 없음",120,165);}
  }
  btn.appendChild(canvas);
  const label=document.createElement("span");
  label.textContent=String(i+1).padStart(2,"0");
  btn.appendChild(label);
  btn.addEventListener("click",()=>openMainDetail(i));
  grid.appendChild(btn);
 }
}
function detailPath(i){return "storyboard_"+String(i).padStart(4,"0")+".jpg";}
function buildDetailGrid(grid){
 grid.innerHTML="";
 for(let i=1;i<=20;i++){
  const btn=document.createElement("button");
  btn.className="storyCell"+(i===detailIndex?" selected":"");
  const img=document.createElement("img");
  img.src=detailPath(i);img.alt="세부 이미지 "+i;img.loading="lazy";
  img.onerror=()=>{
   img.style.display="none";
   btn.style.background="#202635";
  };
  btn.appendChild(img);
  const label=document.createElement("span");
  label.textContent="세부 "+String(i).padStart(2,"0");
  btn.appendChild(label);
  btn.addEventListener("click",()=>openDetailStory(i));
  grid.appendChild(btn);
 }
}
$("storyPrev").addEventListener("click",()=>{
 if(storyMode==="main"){mainIndex=(mainIndex+99)%100;}
 else{detailIndex=((detailIndex-2+20)%20)+1;}
 renderStory();
});
$("storyNext").addEventListener("click",()=>{
 if(storyMode==="main"){mainIndex=(mainIndex+1)%100;}
 else{detailIndex=(detailIndex%20)+1;}
 renderStory();
});

/* 상세 이미지 보기 및 제스처 */
function openMainDetail(i){
 detailKind="main";mainIndex=i;
 $("detailCanvas").style.display="block";
 $("detailImage").style.display="none";
 $("detailScreen").classList.add("show");
 renderDetailImage();resetDetailZoom();updateDetailHeader();
}
function openDetailStory(i){
 detailKind="detail";detailIndex=i;
 $("detailCanvas").style.display="none";
 $("detailImage").style.display="block";
 $("detailImage").src=detailPath(i);
 $("detailScreen").classList.add("show");
 resetDetailZoom();updateDetailHeader();
}
function openFullSprite(){
 detailKind="full";
 $("storyboardScreen").classList.remove("show");
 $("detailCanvas").style.display="none";
 $("detailImage").style.display="block";
 $("detailImage").src="storyboard.png";
 $("detailScreen").classList.add("show");
 resetDetailZoom();updateDetailHeader();
}
function renderDetailImage(){
 const c=$("detailCanvas"),ctx=c.getContext("2d");
 if(!spriteLoaded){
  c.width=700;c.height=450;
  ctx.fillStyle="#171d29";ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="#fff";ctx.font="20px Arial";
  ctx.fillText(spriteFailed?"storyboard.png를 찾을 수 없습니다.":"이미지 불러오는 중...",20,40);
  fitDetailElement();return;
 }
 const W=sprite.naturalWidth,H=sprite.naturalHeight;
 const col=mainIndex%10,row=Math.floor(mainIndex/10);
 const left=col*W/10,top=row*H/10;
 const right=(col+1)*W/10,bottom=(row+1)*H/10;
 c.width=Math.max(1,Math.round(right-left));
 c.height=Math.max(1,Math.round(bottom-top));
 ctx.clearRect(0,0,c.width,c.height);
 ctx.drawImage(sprite,left,top,right-left,bottom-top,0,0,c.width,c.height);
 fitDetailElement();
}
let detailScale=1,detailX=0,detailY=0;
let detailPointers=new Map(),detailPinch=null;
function activeDetailElement(){
 return detailKind==="main"?$("detailCanvas"):$("detailImage");
}
function fitDetailElement(){
 const el=activeDetailElement(),v=$("detailViewport");
 let iw,ih;
 if(el.tagName==="CANVAS"){iw=el.width;ih=el.height;}
 else{
  iw=el.naturalWidth;ih=el.naturalHeight;
  if(!iw||!ih)return;
 }
 if(!iw||!ih)return;
 const ratio=Math.min(v.clientWidth/iw,v.clientHeight/ih);
 el.style.width=(iw*ratio)+"px";
 el.style.height=(ih*ratio)+"px";
 el.dataset.baseWidth=String(iw*ratio);
 el.dataset.baseHeight=String(ih*ratio);
 el.style.left="0";el.style.top="0";
 detailX=(v.clientWidth-iw*ratio)/2;
 detailY=(v.clientHeight-ih*ratio)/2;
 renderDetailTransform();
}
function renderDetailTransform(){
 const el=activeDetailElement();
 el.style.transform=`translate(${detailX}px,${detailY}px) scale(${detailScale})`;
}
function resetDetailZoom(){
 detailScale=1;detailX=0;detailY=0;
 requestAnimationFrame(fitDetailElement);
}
function updateDetailHeader(){
 if(detailKind==="main"){
  $("detailTitle").textContent="메인 스토리보드 "+(mainIndex+1);
  $("detailCounter").textContent=(mainIndex+1)+" / 100";
  $("detailPrev").textContent="◀ 이전 이미지";
  $("detailNext").textContent="다음 이미지 ▶";
  $("detailPrev").style.visibility="visible";
  $("detailNext").style.visibility="visible";
 }else if(detailKind==="detail"){
  $("detailTitle").textContent="세부 스토리보드 "+detailIndex;
  $("detailCounter").textContent=detailIndex+" / 20";
  $("detailPrev").textContent="◀ 이전 스토리보드";
  $("detailNext").textContent="다음 스토리보드 ▶";
  $("detailPrev").style.visibility="visible";
  $("detailNext").style.visibility="visible";
 }else{
  $("detailTitle").textContent="메인 스토리보드 원본 전체 보기";
  $("detailCounter").textContent="원본";
  $("detailPrev").style.visibility="hidden";
  $("detailNext").style.visibility="hidden";
 }
}
$("detailBack").addEventListener("click",()=>{
 $("detailScreen").classList.remove("show");
 $("storyboardScreen").classList.add("show");
 renderStory();
});
$("detailClose").addEventListener("click",()=>{
 $("detailScreen").classList.remove("show");
});
$("detailReset").addEventListener("click",resetDetailZoom);
function moveDetail(delta){
 if(detailKind==="main"){
  mainIndex=(mainIndex+delta+100)%100;
  $("detailCanvas").style.display="block";
  $("detailImage").style.display="none";
  renderDetailImage();
 }else if(detailKind==="detail"){
  detailIndex=((detailIndex-1+delta+20)%20)+1;
  $("detailImage").src=detailPath(detailIndex);
 }
 resetDetailZoom();updateDetailHeader();
}
$("detailPrev").addEventListener("click",()=>moveDetail(-1));
$("detailNext").addEventListener("click",()=>moveDetail(1));
$("detailImage").addEventListener("load",()=>{
 if(detailKind!=="main")fitDetailElement();
});
$("detailImage").addEventListener("error",()=>{
 if(detailKind==="full"){
  const c=$("detailCanvas"),ctx=c.getContext("2d");
  $("detailImage").style.display="none";
  c.style.display="block";c.width=500;c.height=250;
  ctx.fillStyle="#222";ctx.fillRect(0,0,500,250);
  ctx.fillStyle="#fff";ctx.font="18px Arial";
  ctx.fillText("storyboard.png를 불러올 수 없습니다.",20,50);
  fitDetailElement();
 }
});
const viewport=$("detailViewport");
viewport.addEventListener("pointerdown",e=>{
 if(!$("detailScreen").classList.contains("show"))return;
 e.preventDefault();
 try{viewport.setPointerCapture(e.pointerId);}catch(_){}
 const r=viewport.getBoundingClientRect();
 detailPointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
 if(detailPointers.size===2){
  const p=[...detailPointers.values()];
  detailPinch={
   distance:Math.max(1,Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)),
   scale:detailScale,x:detailX,y:detailY,
   cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2
  };
 }
});
viewport.addEventListener("pointermove",e=>{
 if(!detailPointers.has(e.pointerId))return;
 e.preventDefault();
 const r=viewport.getBoundingClientRect();
 const oldPoint=detailPointers.get(e.pointerId);
 detailPointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
 if(detailPointers.size>=2&&detailPinch){
  const p=[...detailPointers.values()];
  const distance=Math.max(1,Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y));
  const cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2;
  const newScale=Math.max(.2,Math.min(12,detailPinch.scale*distance/detailPinch.distance));
  const ratio=newScale/detailPinch.scale;
  detailX=cx-(detailPinch.cx-detailPinch.x)*ratio;
  detailY=cy-(detailPinch.cy-detailPinch.y)*ratio;
  detailScale=newScale;
 }else{
  detailX+=e.clientX-(oldPoint.x+r.left);
  detailY+=e.clientY-(oldPoint.y+r.top);
 }
 renderDetailTransform();
});
function endDetailPointer(e){
 detailPointers.delete(e.pointerId);
 if(detailPointers.size<2)detailPinch=null;
}
viewport.addEventListener("pointerup",endDetailPointer);
viewport.addEventListener("pointercancel",endDetailPointer);
viewport.addEventListener("lostpointercapture",endDetailPointer);
viewport.addEventListener("wheel",e=>{
 if(!$("detailScreen").classList.contains("show"))return;
 e.preventDefault();
 const r=viewport.getBoundingClientRect();
 const px=e.clientX-r.left,py=e.clientY-r.top;
 const oldScale=detailScale;
 const next=Math.max(.2,Math.min(12,oldScale*(e.deltaY<0?1.12:.89)));
 const ratio=next/oldScale;
 detailX=px-(px-detailX)*ratio;
 detailY=py-(py-detailY)*ratio;
 detailScale=next;renderDetailTransform();
},{passive:false});

window.addEventListener("resize",()=>{
 if($("storyboardScreen").classList.contains("show"))renderStory();
 if($("detailScreen").classList.contains("show"))fitDetailElement();
});
})();
</script>
</body>
</html>
