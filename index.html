<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mila Video</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#090a0d;
    color:#f4f4f5;
    font-family:Arial,"Noto Sans KR",sans-serif;
    overflow:hidden;
}

button,input,textarea{
    font:inherit;
}

button{
    border:0;
    color:#fff;
    background:#20232a;
    border-radius:12px;
    min-height:44px;
    padding:0 15px;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

input,textarea{
    width:100%;
    border:1px solid #30343d;
    background:#14161b;
    color:#fff;
    border-radius:12px;
    outline:none;
    padding:12px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.hidden{
    display:none!important;
}

/* =========================
   LOGIN
========================= */

#lockScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    background:#090a0d;
}

.lockBox{
    width:min(420px,100%);
    background:#111319;
    border:1px solid #292d36;
    border-radius:22px;
    padding:25px;
    box-shadow:0 20px 60px #0008;
}

.logo{
    font-size:27px;
    font-weight:800;
    margin-bottom:7px;
}

.sub{
    color:#8f96a3;
    font-size:14px;
    margin-bottom:22px;
}

#passwordInput{
    height:50px;
    margin-bottom:10px;
}

#loginError{
    min-height:20px;
    color:#ff6875;
    font-size:13px;
    margin-bottom:8px;
}

.primary{
    background:#f2f3f5;
    color:#090a0d;
    font-weight:700;
    width:100%;
}

/* =========================
   APP
========================= */

#app{
    width:100%;
    height:100%;
}

.screen{
    width:100%;
    height:100%;
    overflow:auto;
}

#mainScreen{
    padding:
        max(20px,env(safe-area-inset-top))
        16px
        max(24px,env(safe-area-inset-bottom));
}

.mainInner{
    width:min(760px,100%);
    margin:auto;
}

.header{
    padding:10px 0 18px;
}

.headerTitle{
    font-size:25px;
    font-weight:800;
}

.card{
    background:#111319;
    border:1px solid #292d36;
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
}

.label{
    font-size:13px;
    font-weight:700;
    color:#aeb4bf;
    margin-bottom:8px;
}

.titleInput{
    font-size:17px;
    font-weight:700;
}

.saveRow{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.saveRow button{
    flex:1;
}

.storyWrap{
    width:100%;
    display:flex;
    justify-content:center;
}

.storyboardBox{
    position:relative;
    width:min(100%,520px);
    aspect-ratio:1/1;
    border-radius:12px;
    overflow:hidden;
    background:#050608;
}

#storyboard{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
}

.storyGrid{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns:repeat(10,1fr);
    grid-template-rows:repeat(10,1fr);
}

.storyCell{
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,0);
    padding:0;
    min-height:0;
    border-radius:0;
}

.storyCell:active{
    background:rgba(255,255,255,.22);
}

.watchButton{
    width:100%;
    margin-top:4px;
    min-height:52px;
    font-size:16px;
    font-weight:800;
    background:#fff;
    color:#090a0d;
}

/* =========================
   STORY DETAIL
========================= */

#storyDetail{
    position:fixed;
    inset:0;
    z-index:100;
    background:#050608;
}

.storyTop{
    position:absolute;
    z-index:20;
    top:0;
    left:0;
    right:0;
    height:60px;
    padding:
        max(8px,env(safe-area-inset-top))
        10px
        8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(#050608dd,#05060800);
}

.storyTop button{
    background:#171a20dd;
    backdrop-filter:blur(8px);
}

.storyNumber{
    font-size:13px;
    font-weight:700;
    background:#171a20dd;
    padding:8px 11px;
    border-radius:10px;
}

.storyViewport{
    position:absolute;
    inset:0;
    overflow:hidden;
    touch-action:none;
}

#storyZoomImage{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    object-fit:contain;
    transform-origin:0 0;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
}

/* =========================
   VIDEO SCREEN
========================= */

#videoScreen{
    position:fixed;
    inset:0;
    z-index:50;
    background:#000;
}

.videoHeader{
    position:absolute;
    z-index:30;
    left:0;
    right:0;
    top:0;
    min-height:56px;
    padding:
        max(6px,env(safe-area-inset-top))
        8px
        6px;
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(#050608dd,#05060800);
    pointer-events:none;
}

.videoHeader>*{
    pointer-events:auto;
}

.videoHeader button{
    min-width:44px;
    padding:0 10px;
    background:#171a20dd;
    backdrop-filter:blur(8px);
}

.videoTitle{
    min-width:0;
    flex:1;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.videoStage{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#000;
    touch-action:none;
}

/*
 iframe은 실제 pCloud 화면이다.
 클릭 모드에서는 iframe이 직접 입력을 받는다.
 확대 모드에서는 iframe을 transform한다.
*/
#videoFrame{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    border:0;
    background:#000;
    transform-origin:0 0;
    display:block;
}

/* 확대 모드에서 iframe 위에 생기는 이동 영역 */
#zoomTouchLayer{
    position:absolute;
    inset:0;
    z-index:5;
    display:none;
    touch-action:none;
    background:transparent;
}

#videoScreen.zoomMode #zoomTouchLayer{
    display:block;
}

/*
 보기 모드에서는 iframe을 그대로 보여주고
 별도의 입력 레이어를 사용하지 않는다.
*/

/* =========================
   VIDEO MENU
========================= */

.videoMenu{
    position:absolute;
    z-index:60;
    right:10px;
    top:62px;
    width:min(250px,calc(100vw - 20px));
    padding:9px;
    background:#111319f5;
    border:1px solid #30343d;
    border-radius:16px;
    box-shadow:0 15px 50px #000b;
    backdrop-filter:blur(14px);
}

.videoMenu button{
    width:100%;
    text-align:left;
    margin:3px 0;
    background:#1b1e25;
}

.videoMenu button.active{
    background:#fff;
    color:#090a0d;
    font-weight:800;
}

/* =========================
   CROP
========================= */

#cropScreen{
    position:fixed;
    inset:0;
    z-index:200;
    background:#000;
}

.cropHeader{
    position:absolute;
    z-index:50;
    top:0;
    left:0;
    right:0;
    min-height:62px;
    padding:
        max(7px,env(safe-area-inset-top))
        10px
        7px;
    display:flex;
    align-items:center;
    gap:7px;
    background:linear-gradient(#050608ee,#05060800);
}

.cropHeader button{
    background:#171a20ee;
}

.cropStep{
    flex:1;
    text-align:center;
    font-size:13px;
    font-weight:700;
}

.cropStage{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#000;
}

#cropFrame{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    background:#000;
}

.cropShade{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
    background:rgba(0,0,0,.34);
}

#cropDrawLayer{
    position:absolute;
    inset:0;
    z-index:20;
    touch-action:none;
}

.cropRect{
    position:absolute;
    border:2px solid #fff;
    background:rgba(255,255,255,.08);
    box-shadow:0 0 0 9999px rgba(0,0,0,.16);
    display:none;
    pointer-events:none;
}

.cropRect span{
    position:absolute;
    top:-29px;
    left:0;
    background:#fff;
    color:#000;
    border-radius:8px;
    padding:5px 8px;
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
}

.cropBottom{
    position:absolute;
    z-index:40;
    left:10px;
    right:10px;
    bottom:max(10px,env(safe-area-inset-bottom));
    display:flex;
    gap:8px;
}

.cropBottom button{
    flex:1;
    background:#171a20f2;
}

.cropBottom .next{
    background:#fff;
    color:#000;
    font-weight:800;
}

/* =========================
   CROP RESULT
========================= */

.cropInfo{
    position:absolute;
    z-index:70;
    left:10px;
    bottom:72px;
    background:#111319ee;
    border:1px solid #30343d;
    border-radius:12px;
    padding:9px 11px;
    font-size:11px;
    color:#c5cad3;
    max-width:calc(100% - 20px);
}

@media (orientation:landscape){
    .storyboardBox{
        width:min(65vh,520px);
    }
}

@media(max-width:380px){
    .headerTitle{
        font-size:22px;
    }

    .card{
        padding:13px;
    }

    button{
        min-height:42px;
    }
}
</style>
</head>

<body>

<!-- =========================
     PASSWORD
========================= -->

<section id="lockScreen">
    <div class="lockBox">
        <div class="logo">Mila Video</div>
        <div class="sub">계속하려면 비밀번호를 입력하세요.</div>

        <input
            id="passwordInput"

<!-- =========================

========================= -->

<div id="app" class="hidden">

    <!-- MAIN -->
    <section id="mainScreen" class="screen">

        <div class="mainInner">

            <div class="header">
                <div class="headerTitle">Mila Video</div>
            </div>

            <!-- TITLE -->
            <div class="card">

                <div class="label">영상 제목</div>

                <input

                <div class="saveRow">

    <section id="videoScreen" class="hidden">

            </button>

            <div
                id="videoTitle"
                class="videoTitle"
            >
                mila grant prison intake

            <button id="menuButton">

            </button>

        </div>

        <div
            id="videoStage"
            class="videoStage"
        >

            <iframe
                id="videoFrame"
                src="https://u.pcloud.link/publink/show?code=XZlxhzJZrigVSStpBFR7SU4aCsHBo01eFvFV"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
                referrerpolicy="no-referrer-when-downgrade"

        <!-- MENU -->
        <div

            <button

            </div>

        <div class="cropStage">

            <iframe
                id="cropFrame"
                src="https://u.pcloud.link/publink/show?code=XZlxhzJZrigVSStpBFR7SU4aCsHBo01eFvFV"

<script>
"use strict";

/* =========================================================
   CONSTANTS
========================================================= */

const PASSWORD = "mila130102!";

const VIDEO_URL =
    "https://u.pcloud.link/publink/show?code=XZlxhzJZrigVSStpBFR7SU4aCsHBo01eFvFV";

const STORAGE_KEY = "milaVideoDataV1";


/* =========================================================
   DATA
========================================================= */

const defaultData = {
    title:"mila grant prison intake",
    description:"",
    crops:[
        null,
        null,
        null
    ]
};

let data = loadData();

let currentMode = "click";

let storyIndex = 0;

let storyState = {
    scale:1,
    x:0,
    y:0,
    startScale:1,
    startX:0,
    startY:0,
    pointers:new Map(),
    pinchStartDistance:0,
    pinchCenterX:0,
    pinchCenterY:0
};

let cropStep = 0;

let cropDraft = [
    null,
    null,
    null
];

let cropDrawing = false;
let cropStartX = 0;
let cropStartY = 0;


/* =========================================================
   DOM
========================================================= */

const lockScreen =
    document.getElementById("lockScreen");

const passwordInput =
    document.getElementById("passwordInput");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");

const app =
    document.getElementById("app");

const mainScreen =
    document.getElementById("mainScreen");

const titleInput =
    document.getElementById("titleInput");

const descriptionInput =
    document.getElementById("descriptionInput");

const storyboard =
    document.getElementById("storyboard");

const storyGrid =
    document.getElementById("storyGrid");

const storyDetail =
    document.getElementById("storyDetail");

const storyViewport =
    document.getElementById("storyViewport");

const storyZoomImage =
    document.getElementById("storyZoomImage");

const storyNumber =
    document.getElementById("storyNumber");

const videoScreen =
    document.getElementById("videoScreen");

const videoStage =
    document.getElementById("videoStage");

const videoFrame =
    document.getElementById("videoFrame");

const videoTitle =
    document.getElementById("videoTitle");

const videoMenu =
    document.getElementById("videoMenu");

const zoomTouchLayer =
    document.getElementById("zoomTouchLayer");

const cropScreen =
    document.getElementById("cropScreen");

const cropFrame =
    document.getElementById("cropFrame");

const cropDrawLayer =
    document.getElementById("cropDrawLayer");

const cropRect =
    document.getElementById("cropRect");

const cropRectLabel =
    document.getElementById("cropRectLabel");

const cropStepLabel =
    document.getElementById("cropStep");

const cropInfo =
    document.getElementById("cropInfo");


/* =========================================================
   LOCAL STORAGE
========================================================= */

function loadData(){

    try{

        const raw =
            localStorage.getItem(STORAGE_KEY);

        if(!raw){
            return structuredClone(defaultData);
        }

        const parsed =
            JSON.parse(raw);

        return {
            title:
                typeof parsed.title === "string"
                ? parsed.title
                : defaultData.title,

            description:
                typeof parsed.description === "string"
                ? parsed.description
                : "",

            crops:
                Array.isArray(parsed.crops)
                ? [
                    parsed.crops[0] || null,
                    parsed.crops[1] || null,
                    parsed.crops[2] || null
                ]
                : [null,null,null]
        };

    }catch(e){

        return structuredClone(defaultData);
    }
}


function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


/* =========================================================
   INITIAL UI
========================================================= */

titleInput.value = data.title;
descriptionInput.value = data.description;
videoTitle.textContent = data.title;


/* =========================================================
   LOGIN
========================================================= */

function login(){

    if(passwordInput.value === PASSWORD){

        loginError.textContent = "";

        lockScreen.classList.add("hidden");
        app.classList.remove("hidden");

        showMain();

    }else{

        loginError.textContent =
            "비밀번호가 올바르지 않습니다.";

        passwordInput.select();
    }
}


loginButton.addEventListener(
    "click",
    login
);


passwordInput.addEventListener(
    "keydown",
    e => {

        if(e.key === "Enter"){
            e.preventDefault();
            login();
        }

    }
);


/* =========================================================
   MAIN
========================================================= */

function showMain(){

    mainScreen.classList.remove("hidden");

    storyDetail.classList.add("hidden");

    videoScreen.classList.add("hidden");

    cropScreen.classList.add("hidden");

    videoMenu.classList.add("hidden");
}


document.getElementById("saveTitle")
.addEventListener("click",()=>{

    const value =
        titleInput.value.trim();

    data.title =
        value || "mila grant prison intake";

    videoTitle.textContent =
        data.title;

    saveData();

});


document.getElementById("saveDescription")
.addEventListener("click",()=>{

    data.description =
        descriptionInput.value;

    saveData();

});


/* =========================================================
   STORYBOARD 100 CELLS
========================================================= */

function createStoryboardGrid(){

    storyGrid.innerHTML = "";

    for(let i=0;i<100;i++){

        const cell =
            document.createElement("button");

        cell.className =
            "storyCell";

        cell.type = "button";

        cell.setAttribute(
            "aria-label",
            `Storyboard ${i+1}번`
        );

        cell.dataset.index = i;

        cell.addEventListener(
            "click",
            ()=>{
                openStory(i);
            }
        );

        storyGrid.appendChild(cell);
    }
}

createStoryboardGrid();


/* =========================================================
   STORY DETAIL
========================================================= */

function openStory(index){

    storyIndex = index;

    mainScreen.classList.add("hidden");
    storyDetail.classList.remove("hidden");

    storyNumber.textContent =
        `${index + 1} / 100`;

    resetStoryZoom();
}


function resetStoryZoom(){

    const w =
        storyViewport.clientWidth;

    const h =
        storyViewport.clientHeight;

    /*
       전체 storyboard가 10x10이므로
       선택한 한 칸을 화면에 크게 보여주기 위해
       전체 이미지의 10배 크기부터 시작한다.
    */

    storyState.scale = 10;

    const col =
        storyIndex % 10;

    const row =
        Math.floor(storyIndex / 10);

    /*
       선택된 칸의 좌상단이
       viewport 좌상단에 오도록 계산.
    */

    storyState.x =
        -col * w;

    storyState.y =
        -row * h;

    /*
       이미지 자체는 viewport 크기이고
       scale=10이면 한 칸이 viewport 크기가 된다.
    */

    applyStoryTransform();
}


function applyStoryTransform(){

    storyZoomImage.style.transform =
        `translate3d(${storyState.x}px,${storyState.y}px,0) scale(${storyState.scale})`;
}


function storyDistance(a,b){

    const dx =
        a.x-b.x;

    const dy =
        a.y-b.y;

    return Math.sqrt(dx*dx+dy*dy);
}


function storyCenter(a,b){

    return {
        x:(a.x+b.x)/2,
        y:(a.y+b.y)/2
    };
}


function clampStory(){

    const w =
        storyViewport.clientWidth;

    const h =
        storyViewport.clientHeight;

    const scaledW =
        w * storyState.scale;

    const scaledH =
        h * storyState.scale;

    /*
       이미지가 화면을 완전히 덮도록
       이동 범위를 제한한다.
    */

    const minX =
        w-scaledW;

    const minY =
        h-scaledH;

    storyState.x =
        Math.min(
            0,
            Math.max(minX,storyState.x)
        );

    storyState.y =
        Math.min(
            0,
            Math.max(minY,storyState.y)
        );
}


storyViewport.addEventListener(
    "pointerdown",
    e=>{

        storyViewport.setPointerCapture(
            e.pointerId
        );

        storyState.pointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );

        if(storyState.pointers.size === 1){

            storyState.startX =
                storyState.x;

            storyState.startY =
                storyState.y;
        }

        if(storyState.pointers.size === 2){

            const points =
                [...storyState.pointers.values()];

            storyState.pinchStartDistance =
                storyDistance(
                    points[0],
                    points[1]
                );

            storyState.startScale =
                storyState.scale;

            const center =
                storyCenter(
                    points[0],
                    points[1]
                );

            storyState.pinchCenterX =
                center.x;

            storyState.pinchCenterY =
                center.y;

            storyState.startX =
                storyState.x;

            storyState.startY =
                storyState.y;
        }

    }
);


storyViewport.addEventListener(
    "pointermove",
    e=>{

        if(!storyState.pointers.has(e.pointerId))
            return;

        storyState.pointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );

        if(storyState.pointers.size === 1){

            const dx =
                e.clientX -
                [...storyState.pointers.values()][0].x;

            const dy =
                e.clientY -
                [...storyState.pointers.values()][0].y;

            /*
               첫 포인터 이동 기준을 별도 기록하지 않고
               현재 위치 기반으로 보정하기 위해
               이전 포인터 위치를 사용한다.
            */

            const current =
                storyState.pointers.get(e.pointerId);

            if(!current) return;

            if(!storyState._lastPointer){
                storyState._lastPointer = {
                    x:e.clientX,
                    y:e.clientY
                };
                return;
            }

            storyState.x +=
                e.clientX -
                storyState._lastPointer.x;

            storyState.y +=
                e.clientY -
                storyState._lastPointer.y;

            storyState._lastPointer = {
                x:e.clientX,
                y:e.clientY
            };

            clampStory();
            applyStoryTransform();
        }

        if(storyState.pointers.size === 2){

            const points =
                [...storyState.pointers.values()];

            const distance =
                storyDistance(
                    points[0],
                    points[1]
                );

            if(
                storyState.pinchStartDistance > 0
            ){

                let scale =
                    storyState.startScale *
                    distance /
                    storyState.pinchStartDistance;

                scale =
                    Math.max(
                        1,
                        Math.min(30,scale)
                    );

                const center =
                    storyCenter(
                        points[0],
                        points[1]
                    );

                const ratio =
                    scale /
                    storyState.startScale;

                storyState.x =
                    center.x -
                    (storyState.pinchCenterX -
                     storyState.startX) * ratio;

                storyState.y =
                    center.y -
                    (storyState.pinchCenterY -
                     storyState.startY) * ratio;

                storyState.scale = scale;

                clampStory();
                applyStoryTransform();
            }
        }

    }
);


function clearStoryPointer(e){

    storyState.pointers.delete(
        e.pointerId
    );

    storyState._lastPointer = null;

    if(storyState.pointers.size < 2){

        storyState.pinchStartDistance = 0;
    }
}

/* =========================================================
   VIDEO ZOOM / PAN
========================================================= */

let videoTransform = {
    scale:1,
    x:0,
    y:0
};

let videoPointers = new Map();

let videoPinch = {
    distance:0,
    startScale:1,
    centerX:0,
    centerY:0,
    startX:0,
    startY:0
};

let videoLastPointer = null;


function applyVideoTransform(){

    videoFrame.style.transform =
        `translate3d(${videoTransform.x}px,${videoTransform.y}px,0) scale(${videoTransform.scale})`;
}


function clampVideoTransform(){

    const w =
        videoStage.clientWidth;

    const h =
        videoStage.clientHeight;

    const scale =
        videoTransform.scale;

    const scaledW =
        w*scale;

    const scaledH =
        h*scale;

    const minX =
        Math.min(0,w-scaledW);

    const minY =
        Math.min(0,h-scaledH);

    videoTransform.x =
        Math.min(
            0,
            Math.max(minX,videoTransform.x)
        );

    videoTransform.y =
        Math.min(
            0,
            Math.max(minY,videoTransform.y)
        );
}


function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


function center(a,b){

    return {
        x:(a.x+b.x)/2,
        y:(a.y+b.y)/2
    };
}


zoomTouchLayer.addEventListener(
    "pointerdown",
    e=>{

        zoomTouchLayer.setPointerCapture(
            e.pointerId
        );

        videoPointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );

        if(videoPointers.size === 1){

            videoLastPointer = {
                x:e.clientX,
                y:e.clientY
            };
        }

        if(videoPointers.size === 2){

            const pts =
                [...videoPointers.values()];

            videoPinch.distance =
                distance(pts[0],pts[1]);

            videoPinch.startScale =
                videoTransform.scale;

            const c =
                center(pts[0],pts[1]);

            videoPinch.centerX = c.x;
            videoPinch.centerY = c.y;

            videoPinch.startX =
                videoTransform.x;

            videoPinch.startY =
                videoTransform.y;

            videoLastPointer = null;
        }

    }
);


zoomTouchLayer.addEventListener(
    "pointermove",
    e=>{

        if(!videoPointers.has(e.pointerId))
            return;

        videoPointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );

        if(videoPointers.size === 1){

            if(!videoLastPointer){

                videoLastPointer = {
                    x:e.clientX,
                    y:e.clientY
                };

                return;
            }

            videoTransform.x +=
                e.clientX -
                videoLastPointer.x;

            videoTransform.y +=
                e.clientY -
                videoLastPointer.y;

            videoLastPointer = {
                x:e.clientX,
                y:e.clientY
            };

            clampVideoTransform();
            applyVideoTransform();
        }

        if(videoPointers.size === 2){

            const pts =
                [...videoPointers.values()];

            const d =
                distance(pts[0],pts[1]);

            if(videoPinch.distance <= 0)
                return;

            let newScale =
                videoPinch.startScale *
                d /
                videoPinch.distance;

            newScale =
                Math.max(
                    1,
                    Math.min(20,newScale)
                );

            const c =
                center(pts[0],pts[1]);

            const ratio =
                newScale /
                videoPinch.startScale;

            videoTransform.x =
                c.x -
                (videoPinch.centerX -
                 videoPinch.startX) * ratio;

            videoTransform.y =
                c.y -
                (videoPinch.centerY -
                 videoPinch.startY) * ratio;

            videoTransform.scale =
                newScale;

            clampVideoTransform();
            applyVideoTransform();
        }

    }
);


function endVideoPointer(e){

    videoPointers.delete(
        e.pointerId
    );

    if(videoPointers.size === 0){

        videoLastPointer = null;

    }else if(videoPointers.size === 1){

        const p =
            [...videoPointers.values()][0];

        videoLastPointer = {
            x:p.x,
            y:p.y
        };

        videoPinch.distance = 0;
    }

}


zoomTouchLayer.addEventListener(
    "pointerup",
    endVideoPointer
);

zoomTouchLayer.addEventListener(
    "pointercancel",
    endVideoPointer
);

zoomTouchLayer.addEventListener(
    "lostpointercapture",
    endVideoPointer
);

}

function updateCropStep(){

    const names = [
        "영상",
        "영상 길이 바",
        "설정 바"
    ];

    if(cropStep < 3){

        cropStepLabel.textContent =
            `${cropStep+1}번 ${names[cropStep]} 영역을 드래그하세요`;

        cropRectLabel.textContent =
            names[cropStep];

        cropInfo.textContent =
            `${cropStep+1} / 3 · ${names[cropStep]} 영역 지정`;
    }
}


function showExistingCrop(){

    const crop =
        cropDraft[cropStep];

    if(!crop){

        cropRect.style.display =
            "none";

        return;
    }

    const rect =
        cropDrawLayer.getBoundingClientRect();

    cropRect.style.display =
        "block";

    cropRect.style.left =
        (crop.x * rect.width) + "px";

    cropRect.style.top =
        (crop.y * rect.height) + "px";

    cropRect.style.width =
        (crop.width * rect.width) + "px";

    cropRect.style.height =
        (crop.height * rect.height) + "px";
}


/*
   화면 좌표 -> 0~1 정규화 좌표
*/

function normalizedPoint(clientX,clientY){

    const r =
        cropDrawLayer.getBoundingClientRect();

    return {
        x:Math.max(
            0,
            Math.min(
                1,
                (clientX-r.left)/r.width
            )
        ),

        y:Math.max(
            0,
            Math.min(
                1,
                (clientY-r.top)/r.height
            )
        )
    };
}


function drawCropRect(x1,y1,x2,y2){

    const left =
        Math.min(x1,x2);

    const top =
        Math.min(y1,y2);

    const right =
        Math.max(x1,x2);

    const bottom =
        Math.max(y1,y2);

    const r =
        cropDrawLayer.getBoundingClientRect();

    cropRect.style.display =
        "block";

    cropRect.style.left =
        (left*r.width)+"px";

    cropRect.style.top =
        (top*r.height)+"px";

    cropRect.style.width =
        ((right-left)*r.width)+"px";

    cropRect.style.height =
        ((bottom-top)*r.height)+"px";
}


cropDrawLayer.addEventListener(
    "pointerdown",
    e=>{

        if(cropStep >= 3)
            return;

        cropDrawing = true;

        cropDrawLayer.setPointerCapture(
            e.pointerId
        );

        const p =
            normalizedPoint(
                e.clientX,
                e.clientY
            );

        cropStartX = p.x;
        cropStartY = p.y;

        drawCropRect(
            cropStartX,
            cropStartY,
            p.x,
            p.y
        );

    }
);


cropDrawLayer.addEventListener(
    "pointermove",
    e=>{

        if(!cropDrawing)
            return;

        const p =
            normalizedPoint(
                e.clientX,
                e.clientY
            );

        drawCropRect(
            cropStartX,
            cropStartY,
            p.x,
            p.y
        );

    }
);


cropDrawLayer.addEventListener(
    "pointerup",
    finishCropDraw
);


cropDrawLayer.addEventListener(
    "pointercancel",
    finishCropDraw
);


function finishCropDraw(e){

    if(!cropDrawing)
        return;

    cropDrawing = false;

    const p =
        normalizedPoint(
            e.clientX,
            e.clientY
        );

    const x =
        Math.min(
            cropStartX,
            p.x
        );

    const y =
        Math.min(
            cropStartY,
            p.y
        );

    const width =
        Math.abs(
            p.x-cropStartX
        );

    const height =
        Math.abs(
            p.y-cropStartY
        );

    /*
       너무 작은 영역은 실수로 간주한다.
    */

    if(width < .02 || height < .02){

        showExistingCrop();
        return;
    }

    cropDraft[cropStep] = {
        x,
        y,
        width,
        height
    };

    showExistingCrop();
}

/* =========================================================
   APPLY CROP
========================================================= */

/*
   외부 iframe 내부의 실제 pCloud DOM은
   same-origin 정책 때문에 접근할 수 없다.

   대신 저장된 정규화 좌표를 이용해
   iframe의 표시 영역을 제한한다.

   세 영역을 모두 표시해야 하므로
   CSS clip-path의 polygon으로
   세 직사각형을 하나의 표시 영역으로 합친다.
*/

function applySavedCrop(){

    const crops =
        data.crops.filter(Boolean);

    if(crops.length !== 3){

        videoFrame.style.clipPath =
            "none";

        return;
    }

    /*
       polygon은 일반적인 다중 사각형 union을
       정확하게 표현하기 어렵기 때문에,
       영상 영역을 기준으로 표시하고
       아래의 crop guide를 통해
       2번/3번 영역 좌표를 유지한다.

       실제 iframe 내부의 영상 길이바와 설정바를
       부모 JS가 직접 잘라내거나 이동시키는 것은
       cross-origin iframe 특성상 불가능하다.
    */

    const video =
        crops[0];

    const x =
        video.x*100;

    const y =
        video.y*100;

    const r =
        (video.x+video.width)*100;

    const b =
        (video.y+video.height)*100;

    videoFrame.style.clipPath =
        `polygon(
            ${x}% ${y}%,
            ${r}% ${y}%,
            ${r}% ${b}%,
            ${x}% ${b}%
        )`;
}


function showAppliedCropNotice(){

            );

        }

    }
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{
        /*
           새로고침 시에는 브라우저가 페이지를
           새로 생성하므로 lockScreen이 다시 나타난다.
           영상/스토리 화면 상태는 localStorage에 저장하지 않는다.
        */
    }
);

</script>
